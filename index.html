const SLOT_JST=[11,15,19,23,3,7];
const REF_MON=Date.UTC(2026,10,16,2,0); // Mon 2026-11-16 11:00 JST = start of a game Monday
const DAY=864e5, HR=36e5;
const AT_TZ="Etc/GMT+2"; // AT = UTC-2 (JST-11)
const TZ_LIST=["Asia/Tokyo","Asia/Seoul","Asia/Shanghai","Asia/Manila","Asia/Bangkok","Asia/Ho_Chi_Minh","Asia/Jakarta","Asia/Kolkata","Australia/Sydney","Europe/London","Europe/Paris","Europe/Rome","America/New_York","America/Chicago","America/Mexico_City","America/Los_Angeles","America/Sao_Paulo","UTC"];
function autoTZ(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||"Asia/Tokyo"; }catch(e){ return "Asia/Tokyo"; } }
let tzChoice="auto";
try{ const s=localStorage.getItem("crls-tz"); if(s) tzChoice=s; }catch(e){}
function curTZ(){ return tzChoice==="auto"?autoTZ():tzChoice; }
function parts(ms,tz){
  const f=new Intl.DateTimeFormat("en-GB",{timeZone:tz||curTZ(),year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  const o={}; f.formatToParts(new Date(ms)).forEach(p=>o[p.type]=p.value);
  return {hm:`${o.hour}:${o.minute}`, ymd:`${o.year}-${o.month}-${o.day}`};
}
function weekStart(){ const n=Date.now(); const d=Math.floor((n-REF_MON)/DAY); return REF_MON+Math.floor(d/7)*7*DAY; }
function nowGame(){ const e=Date.now()-REF_MON; const dd=((e%(7*DAY))+7*DAY)%(7*DAY); return {idx:Math.floor(dd/DAY), slot:Math.floor((dd%DAY)/(4*HR))}; }
// time of each slot (by JST hour) as shown in the chosen zone
function slotTimes(){ const w=weekStart(); const m={}; SLOT_JST.forEach((h,j)=>{ m[String(h).padStart(2,"0")]=parts(w+j*4*HR).hm; }); return m; }
function fillTimes(s){ const m=slotTimes(); return s.replace(/\{(\d\d)\}/g,(x,k)=>m[k]||x); }
function rich(parent,s){ richText(parent,fillTimes(s)); }
let selDay=null;
function renderTasks(){
  const L=TASKS[state.lang], box=$("view-tasks"); box.replaceChildren();
  const now=nowGame(); if(selDay===null) selDay=now.idx;
  const w=weekStart();
  // header
  const hd=el("div","tk-head");
  hd.append(el("h2","tk-h1",L.h1), el("p","tk-lead",L.lead));
  const tzrow=el("div","tk-tz");
  const lab=el("label",null,L.tzL); lab.htmlFor="tz";
  const sel=el("select"); sel.id="tz";
  const oa=el("option",null,`${L.tzAuto} – ${autoTZ()}`); oa.value="auto"; sel.append(oa);
  TZ_LIST.forEach(z=>{ const o=el("option",null,z.replace(/_/g," ")); o.value=z; sel.append(o); });
  sel.value=tzChoice;
  sel.addEventListener("change",()=>{ tzChoice=sel.value; try{localStorage.setItem("crls-tz",tzChoice);}catch(e){} renderTasks(); renderRules(); });
  tzrow.append(lab,sel); hd.append(tzrow);
  hd.append(el("p","tk-tznote",L.tzNote.replace("{tz}",curTZ()===AT_TZ?L.atL:curTZ().replace(/_/g," ")).replace("{t}",parts(w).hm)));
  box.append(hd);
  // common rules
  box.append(el("h3","tk-sec",L.common));
  const rules=el("div","tk-rules");
  [["r1t","r1p"],["r2t","r2p"],["r3t","r3p"]].forEach(([a,b],i)=>{
    const c=el("div","tk-card"); c.append(el("h4",null,L[a])); const p=el("p"); rich(p,L[b]); c.append(p);
    if(i===0){ const ch=el("div","tk-slots"); SLOT_JST.forEach((h,j)=>{ const x=el("span","tk-chip"+((j===2||j===5)?" hot":""),parts(w+j*4*HR).hm); if(curTZ()!==AT_TZ) x.append(el("small",null," AT "+parts(w+j*4*HR,AT_TZ).hm)); ch.append(x); }); c.append(ch); }
    rules.append(c);
  });
  box.append(rules);
  // day tabs
  box.append(el("h3","tk-sec",L.detail));
  const tabs=el("div","tk-tabs"); tabs.setAttribute("role","tablist");
  DAYDEF.forEach((d,i)=>{
    const b=el("button","tk-tab"); b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",String(i===selDay));
    b.style.setProperty("--theme",d.color);
    b.append(el("span","tk-wd",L.wd[i]), el("small",null,L.short[i]));
    if(i===now.idx) b.append(el("span","tk-today",L.today));
    b.addEventListener("click",()=>{ selDay=i; renderTasks(); });
    tabs.append(b);
  });
  box.append(tabs);
  // selected day
  const i=selDay, d=DAYDEF[i];
  const sec=el("section","tk-day"); sec.style.setProperty("--theme",d.color);
  const dh=el("div","tk-dayhead"); dh.append(el("div","tk-dayname",L.wd[i]));
  const th=el("div","tk-daytheme"); th.append(el("small",null,L.themeL), el("strong",null,L.themes[i])); dh.append(th); sec.append(dh);
  const tl=el("div","tk-timeline"); const start=w+i*DAY; const d0=parts(start).ymd;
  d.slots.forEach((s,j)=>{
    const p=parts(start+j*4*HR);
    const c=el("div","tk-ts"+(d.match.includes(j)?" match":"")+((i===now.idx&&j===now.slot)?" now":""));
    if(d.match.includes(j)) c.dataset.badge=L.match;
    const t=el("div","t",p.hm); if(p.ymd!==d0) t.append(el("sup",null,"+1"));
    const bar=el("div","bar"); bar.style.background=CATC[s];
    c.append(t);
    if(curTZ()!==AT_TZ) c.append(el("div","at","AT "+parts(start+j*4*HR,AT_TZ).hm));
    c.append(el("div","n",L.cats[s]), bar); tl.append(c);
  });
  sec.append(tl);
  const g=el("div","tk-grid2");
  const c1=el("div","tk-card"); c1.append(el("h4",null,L.tasksT)); const tg=el("div","tk-tasks"); L.tasks[i].forEach(x=>tg.append(el("span","tk-task",x))); c1.append(tg);
  const c2=el("div","tk-card"); c2.append(el("h4",null,L.todoT)); const ul=el("ul","tk-todo"); L.todo[i].forEach(x=>{ const li=el("li"); rich(li,x); ul.append(li); }); c2.append(ul);
  g.append(c1,c2); sec.append(g); box.append(sec);
  // legend
  const lg=el("div","tk-legend");
  Object.keys(CATC).forEach(k=>{ const s=el("span"); const dot=el("i"); dot.style.background=CATC[k]; s.append(dot,L.cats[k]); lg.append(s); });
  const sm=el("span"); const dm=el("i"); dm.style.background="var(--brass)"; sm.append(dm,L.matchL); lg.append(sm);
  lg.append(el("span",null,L.nextL)); box.append(lg);
  // overview table
  box.append(el("h3","tk-sec",L.week));
  const sc=el("div","tk-scroll"); const tb=el("table","tk-tbl");
  const hr=el("tr"); hr.append(el("th",null,L.thDay), el("th",null,L.thTheme));
  SLOT_JST.forEach((h,j)=>{ const p=parts(w+j*4*HR), q=parts(w).ymd; const thc=el("th",null,p.hm); if(p.ymd!==q) thc.append(el("sup",null,"+1")); if(curTZ()!==AT_TZ) thc.append(el("div","at","AT "+parts(w+j*4*HR,AT_TZ).hm)); hr.append(thc); });
  tb.append(hr);
  DAYDEF.forEach((dd,k)=>{
    const tr=el("tr",k===now.idx?"cur":null);
    tr.append(el("td",null,L.wd[k]), el("td",null,L.short[k]));
    dd.slots.forEach((s,j)=>{ const td=el("td"); const sp=el("span","tk-cell"+(dd.match.includes(j)?" m":""),L.cats[s]); sp.style.background=CATC[s]; td.append(sp); tr.append(td); });
    tb.append(tr);
  });
  sc.append(tb); box.append(sc);
  // tips
  box.append(el("h3","tk-sec",L.tipsT));
  const tc=el("div","tk-card"); const tul=el("ul","tk-tips"); L.tips.forEach(x=>{ const li=el("li"); rich(li,x); tul.append(li); }); tc.append(tul); box.append(tc);
  box.append(el("p","note",L.note));
}

// ---- SvS ----
const SVS_MUST=[4,5,6];
function renderSvs(){
  const S=SVS[state.lang], Tk=TASKS[state.lang], box=$("view-svs"); box.replaceChildren();
  const hd=el("div","tk-head"); hd.append(el("h2","tk-h1",S.title)); box.append(hd);
  // overview + week strip
  box.append(el("h3","tk-sec",S.ovT));
  const ov=el("div","tk-card sv-ov");
  S.ov.forEach(p=>ov.append(el("p",null,p)));
  const strip=el("div","sv-week");
  [6,0,1,2,3,4,5].forEach((d,k)=>{ const c=el("div","sv-d"+(k===6?" battle":"")); c.append(el("span","sv-wd",Tk.wd[d])); strip.append(c); });
  const lab=el("div","sv-weeklab"); lab.append(el("span","sv-a",S.pA), el("span","sv-b",S.pB));
  ov.append(strip, lab); box.append(ov);
  // tasks
  box.append(el("h3","tk-sec",S.tT));
  const tc=el("div","tk-card"); tc.append(el("p","sv-lead",S.tL));
  const ol=el("ol","sv-tasks");
  S.tasks.forEach((x,i)=>{ const li=el("li",SVS_MUST.includes(i)?"must":null); li.append(el("span","sv-tx",x)); if(SVS_MUST.includes(i)) li.append(el("span","sv-badge",S.must)); ol.append(li); });
  tc.append(ol); box.append(tc);
  // must-do
  box.append(el("h3","tk-sec",S.mT));
  const mg=el("div","sv-must");
  S.mi.forEach(([h,b],i)=>{ const c=el("div","sv-mcard"); c.append(el("div","sv-num",String(i+1)), el("h4",null,h), el("p",null,b)); mg.append(c); });
  box.append(mg);
  // defense / offense
  const g=el("div","sv-sides");
  [["def",S.dT,S.d],["off",S.oT,S.o]].forEach(([k,t,p])=>{ const c=el("div","sv-side "+k); c.append(el("h4",null,t), el("p",null,p)); g.append(c); });
  box.append(g);
  const f=el("figure","rule-fig sv-fig"); const im=el("img"); im.src=SVS_IMG; im.alt=S.cap; im.loading="lazy"; f.append(im, el("figcaption",null,S.cap)); box.append(f);
}

// ---- HQ level requirements ----
let hqFrom=24, hqTo=30;
function fmtRes(n){
  if(!n) return "—";
  if(n>=1e9) return (n/1e9).toFixed(3).replace(/\.?0+$/,"")+"G";
  if(n>=1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M";
  return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K";
}
function renderHQ(){
  const L=HQ.L[state.lang], box=$("view-hq"); box.replaceChildren();
  const hd=el("div","tk-head"); hd.append(el("h2","tk-h1",L.tab), el("p","tk-lead",L.lead)); box.append(hd);
  const rf=el("div","hq-ref"); rf.append(el("span","hq-ref-i","ⓘ"), el("span",null,L.ref)); box.append(rf);
  // calculator
  const calc=el("div","tk-card hq-calc"); calc.append(el("h4",null,L.calcT));
  const row=el("div","hq-sel");
  const mk=(id,label,min,max,val,set)=>{ const w=el("label","hq-field"); w.htmlFor=id; w.append(el("span",null,label)); const s=el("select"); s.id=id;
    for(let v=min;v<=max;v++){ const o=el("option",null,"Lv."+v); o.value=v; s.append(o); } s.value=val;
    s.addEventListener("change",()=>{ set(+s.value); renderHQ(); }); w.append(s); return w; };
  row.append(mk("hq-from",L.from,3,29,hqFrom,v=>{ hqFrom=v; if(hqTo<=v) hqTo=v+1; }), el("span","hq-arrow","→"), mk("hq-to",L.to,4,30,hqTo,v=>{ hqTo=v; if(hqFrom>=v) hqFrom=v-1; }));
  calc.append(row);
  const sel=HQ.rows.filter(r=>r.lv>hqFrom&&r.lv<=hqTo);
  const tot=[sel.reduce((a,r)=>a+r.wn,0), sel.reduce((a,r)=>a+r.zn,0), sel.reduce((a,r)=>a+r.fn,0)];
  const tg=el("div","hq-tot");
  L.res.forEach((n,i)=>{ const c=el("div","hq-totc"); c.append(el("span","k",`${L.total} · ${n}`), el("span","v",fmtRes(tot[i]))); tg.append(c); });
  calc.append(tg); box.append(calc);
  // table
  const sc=el("div","tk-scroll"); const tb=el("table","tk-tbl hq-tbl");
  const hr=el("tr"); [L.lv,...L.res,L.pre].forEach(h=>hr.append(el("th",null,h))); tb.append(hr);
  HQ.rows.forEach(r=>{
    const tr=el("tr",(r.lv>hqFrom&&r.lv<=hqTo)?"sel":null);
    const cell=(c,v,lab)=>{ const d=el("td",c,v); if(lab) d.dataset.l=lab; return d; };
    tr.append(cell("lv","Lv."+r.lv), cell("num",r.w,L.res[0]), cell("num",r.z,L.res[1]), cell("num",r.f,L.res[2]));
    const td=el("td","pre"); r.pre.forEach(([lv,k])=>td.append(el("span","hq-chip",`${L.bld[k]} Lv.${lv}`))); tr.append(td);
    tb.append(tr);
  });
  sc.append(tb); box.append(sc);
  box.append(el("p","note",L.note));
}

let shownRows=[];
function csvCell(v){ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function buildCSV(){
  const L=t();
  const head=[L.place,L.name,L.rank,"HQ",L.power+" (M)",L.arena+" (M)","SvS",L.inactive];
  const lines=[head.map(csvCell).join(",")];
  shownRows.forEach(d=>lines.push([d.place,d.n,rkLabel(d.rk),d.hq,d.p.toFixed(1),d.ap.toFixed(1),L[d.s],d.ia?L.inactive:""].map(csvCell).join(",")));
  return lines.join("\r\n");
}
function toast(msg){ const e=$("toast"); e.textContent=msg; clearTimeout(toast.t); toast.t=setTimeout(()=>{e.textContent="";},3500); }
$("csv").addEventListener("click",()=>{
  const csv=buildCSV();
  let saved=false;
  try{
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="CRLS_members_2026-11-14.csv";
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    saved=true;
  }catch(e){}
  if(window.self!==window.top || !saved){
    navigator.clipboard && navigator.clipboard.writeText(csv).then(()=>toast(saved?t().copied:t().copiedFb)).catch(()=>{});
  }
});
function render(){
  const L=t();
  const rows = DATA.filter(d =>
    (state.svs==="all"||d.s===state.svs) &&
    (state.rank==="all"||d.rk===state.rank) &&
    (!state.q||d.n.toLowerCase().includes(state.q)));
  const k=state.key, dir=state.dir;
  rows.sort((a,b)=>{ const x=val(a,k), y=val(b,k); const c=x<y?-1:x>y?1:0; return (dir<0?-c:c) || b.p-a.p; });
  const tb=document.querySelector("#tbl tbody"); tb.replaceChildren();
  rows.forEach(d=>{
    const st=S.find(x=>x.key===d.s);
    const tr=el("tr", d.place<=3?"top3":null);
    const nm=el("td","name"); const dt=el("span","dot"); dt.style.background=st.color; if(d.s==="none") dt.style.visibility="hidden"; nm.append(dt,d.n); if(d.ia) nm.append(" ",el("span","ia",L.inactive));
    tr.append(el("td","num",d.place), nm);
    const r=el("td"); r.append(el("span","rk "+(d.rk==="?"?"":d.rk),rkLabel(d.rk))); tr.append(r);
    tr.append(el("td","num",d.hq), el("td","num",fmt(d.p)+"M"), el("td","num ap",fmt(d.ap)+"M"));
    const s=el("td"); if(d.s!=="none") s.append(el("span","pill "+st.cls,L[d.s])); tr.append(s);
    tb.append(tr);
  });
  shownRows=rows;
  $("csv").title=L.csvTip;
  $("count").textContent = rows.length ? L.shown(rows.length, fmt(rows.reduce((a,d)=>a+d.p,0))) : L.empty;
}
applyLang();
showView();
setInterval(()=>{ if(!$("view-tasks").hidden) renderTasks(); },60000);

})();
