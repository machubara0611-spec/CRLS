<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRLS Member Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 作戦ボード: 鋼鉄グレーの地に真鍮色のアクセント。上に要約、下に名簿 */
:root{
  --bg:#15181c; --panel:#1e2329; --line:#2f363e; --ink:#e7e9ec; --muted:#9aa3ad; --brass:#d9a441;
  --mud:#8fbf5a; --grass:#5fa8d9; --no:#e0675e; --none:#c9b458;
  --display:"Oswald","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans JP","Noto Sans Thai",system-ui,-apple-system,"Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:2px solid var(--brass);padding-bottom:10px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.04em;margin:0;text-wrap:balance}
h1 span{color:var(--brass)}
.meta{display:grid;gap:6px;justify-items:end}
.updated{color:var(--muted);font-size:13px}
h1 small.game{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none;color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;padding:8px 16px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brass);background:var(--panel);border-color:var(--line)}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.view{display:grid;gap:18px}
.view[hidden]{display:none}
.rules{display:grid;gap:14px}
.rulecard{background:var(--panel);border:1px solid var(--line);border-left:4px solid #c8631f;border-radius:6px;padding:0;overflow:hidden}
.rc-body{padding:16px 18px}
.rule-fig{margin:0 0 14px;max-width:560px}
.rule-fig img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.rule-fig figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.rulecard h2{font-size:20px;margin:0}
.rulecard ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:r}
.rulecard ol li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;line-height:1.65;max-width:70ch}
.rulecard ol li::before{content:counter(r);font-family:var(--display);font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--brass);display:grid;place-items:center;font-size:14px;margin-top:1px}
.rulecard ol li.tip{background:rgba(143,191,90,.1);border-radius:6px;padding:6px 8px 6px 0}
.rulecard ol li.tip::before{background:#8fbf5a;color:#13200a}
.rulecard ol li.loc{color:#f0b429;font-weight:700;font-variant-numeric:tabular-nums}
.rulecard ol li.warn{background:rgba(224,103,94,.1);border-radius:6px;padding:6px 8px 6px 0;margin-left:-0px}
.rulecard ol li.warn::before{background:var(--no);color:#1a0a08}
.langs{display:flex;align-items:center;gap:6px;font-size:14px}
.langs select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--brass);border-radius:4px;padding:4px 8px;cursor:pointer}
select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h2{font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:.08em;color:var(--brass);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);margin-left:3px}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:8px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.controls{display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lbl{color:var(--muted);font-size:12px;width:64px}
button.chip{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
button.chip:hover{border-color:var(--muted)}
button.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1a1405;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input#q{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:min(100%,280px)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:#252b32;font-weight:500;font-size:12px;color:var(--muted)}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--brass)}
th[aria-sort="descending"] button::after{content:" ▼"}
th[aria-sort="ascending"] button::after{content:" ▲"}
td.num,th.num{text-align:right}
td.ap{color:var(--muted)}
td.name{font-weight:500;white-space:normal;min-width:120px}
tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
.rk{font-family:var(--display);font-size:13px;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.rk.R5{background:var(--brass);color:#1a1405;border-color:var(--brass)}
.rk.R4{border-color:var(--brass);color:var(--brass)}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700;display:inline-block}
.s-mud{background:rgba(143,191,90,.18);color:var(--mud)}
.s-grass{background:rgba(95,168,217,.18);color:var(--grass)}
.s-no{background:rgba(224,103,94,.18);color:var(--no)}
.s-none{background:rgba(201,180,88,.14);color:var(--none)}
.top3 td:first-child{color:var(--brass);font-weight:700}
.ia{font-size:11px;font-weight:400;color:#f0a090;border:1px solid rgba(224,103,94,.5);border-radius:3px;padding:0 5px;margin-left:4px;white-space:nowrap}
.countrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.csvbtn{font:inherit;font-size:13px;font-weight:700;color:#1a1405;background:var(--brass);border:0;border-radius:6px;padding:6px 14px;cursor:pointer;margin-left:auto}
.csvbtn:hover{filter:brightness(1.08)}
.toast{font-size:12px;color:var(--mud)}
.count{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12px;max-width:70ch}
@media (max-width:480px){.tab{font-size:13px;padding:8px 10px}h1{font-size:24px}th,td{padding:6px 7px}.row .lbl{width:100%}.meta{justify-items:start}}

.rules-nav{display:flex;flex-wrap:wrap;gap:6px}
.rules-nav a{font-size:13px;color:var(--ink);text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.rules-nav a:hover{border-color:var(--brass)}
.canyon{}
.cc-head{background:linear-gradient(135deg,#8f4316,#c8631f);padding:14px 18px;text-align:center}
.cc-head h2{color:#fff;margin:0;font-size:24px;letter-spacing:.03em}
.cc-sub{color:#fbe2cc;font-size:13px}
.canyon > *:not(.cc-head){margin-left:18px;margin-right:18px}
.cc-phases{display:grid;gap:8px;margin-top:16px}
.cc-phase{background:#252b32;border-left:4px solid #c8631f;border-radius:6px;padding:10px 14px}
.cc-phase h3{margin:0 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:16px}
.cc-pill{background:#8f4316;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.cc-phase p{margin:0;color:#d2d6db;line-height:1.65;font-size:14px}
.cc-phase strong{color:#f0a868}
.cc-sec{text-align:center;font-size:17px;margin:20px 18px 8px;color:var(--ink)}
.cc-map{background:#fdfbf7;border-radius:8px;padding:6px;max-width:640px;margin:0 auto !important}
.cc-map svg{display:block;width:100%;height:auto}
.cc-map text{font-family:var(--body)}
.cc-legend{list-style:none;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;font-size:13px;color:#d2d6db;background:#252b32;border-radius:6px;margin-top:10px}
.cc-legend li{display:flex;align-items:center;gap:8px}
.cc-legend svg{flex:none;background:#fdfbf7;border-radius:4px;padding:1px}
.cc-tips{list-style:none;padding:12px 14px;margin-top:0;display:grid;gap:8px;background:#252b32;border-radius:6px;font-size:14px;color:#d2d6db;line-height:1.6}
.cc-tips strong{color:#f0a868}
.cc-lineup-wrap{overflow-x:auto;margin-bottom:18px}
.cc-lineup{display:grid;gap:6px;min-width:520px;background:#252b32;border-radius:6px;padding:12px}
.cc-row{display:grid;grid-template-columns:90px 1.2fr repeat(4,1fr);gap:8px;align-items:center}
.cc-name{display:flex;align-items:center;gap:6px;color:var(--sq);font-size:13px}
.cc-badge{background:var(--sq);color:#fff;font-weight:700;border-radius:4px;width:26px;height:26px;display:grid;place-items:center}
.cc-cell{border:2px solid var(--sq);border-radius:5px;text-align:center;font-weight:700;color:var(--sq);padding:3px 0;background:#1b1f24;font-family:var(--display)}
.cc-cap{display:flex;align-items:center;justify-content:center;gap:5px;color:#f0a090;border-color:#7a3b30;background:#3a2622;font-family:var(--body);font-size:13px}
@media (max-width:480px){.cc-lineup{min-width:0;padding:8px}.cc-row{grid-template-columns:28px 1.4fr repeat(4,1fr);gap:5px}.cc-name span:last-child{display:none}.cc-cap{font-size:11px}.canyon > *:not(.cc-head){margin-left:10px;margin-right:10px}.cc-head h2{font-size:20px}}

.tk-head{display:grid;gap:6px}
.tk-h1{font-size:24px;margin:0;color:var(--ink);font-weight:700;letter-spacing:.02em}
.tk-lead{margin:0;color:var(--muted);font-size:14px}
.tk-tz{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tk-tz select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px;max-width:100%}
.tk-tznote{margin:0;font-size:12px;color:var(--muted)}
.tk-sec{font-size:17px;margin:14px 0 0;display:flex;align-items:center;gap:10px;color:var(--ink)}
.tk-sec::before{content:"";width:5px;height:18px;background:var(--brass);border-radius:2px}
.tk-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.tk-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.tk-card h4{margin:0 0 6px;font-size:15px;color:var(--brass)}
.tk-card p{margin:0;font-size:14px;line-height:1.7}
.tk-card strong{color:#f0b429}
.tk-slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tk-chip{font-family:var(--display);font-size:13px;background:#252b32;border:1px solid var(--line);padding:1px 8px;border-radius:4px}
.tk-chip.hot{border-color:#f0b429;color:#f0b429}
.tk-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tk-tab{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 2px;text-align:center;font-weight:700;font-size:14px;position:relative;min-width:0}
.tk-tab small{display:block;font-size:10px;font-weight:500;line-height:1.2;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-tab:hover{color:var(--ink)}
.tk-tab[aria-selected="true"]{background:var(--theme);border-color:var(--theme);color:#111}
.tk-today{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;background:#f0b429;color:#1a1300;padding:0 6px;border-radius:8px;white-space:nowrap}
.tk-day{display:grid;gap:10px}
.tk-dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--theme);border-radius:8px;padding:14px 16px}
.tk-dayname{font-family:var(--display);font-size:30px;line-height:1;color:var(--theme)}
.tk-daytheme small{display:block;color:var(--muted);font-size:12px}
.tk-daytheme strong{font-size:20px}
.tk-timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media(max-width:600px){.tk-timeline{grid-template-columns:repeat(3,1fr)}}
.tk-ts{border-radius:8px;padding:10px 4px;text-align:center;background:var(--panel);border:1px solid var(--line);position:relative}
.tk-ts .t{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.tk-ts sup,.tk-tbl sup{font-size:10px;color:var(--muted);margin-left:2px}
.tk-ts .at,.tk-tbl .at{font-size:10px;color:var(--muted);font-family:var(--body);font-weight:400}
.tk-chip small{font-size:10px;color:var(--muted);font-family:var(--body)}
.tk-ts .n{font-size:13px;font-weight:700;margin-top:2px}
.tk-ts .bar{height:4px;border-radius:2px;margin:6px auto 0;width:60%}
.tk-ts.match{border:2px solid #f0b429;background:#2c2714}
.tk-ts.match::after{content:attr(data-badge);position:absolute;top:-9px;right:6px;font-size:10px;background:#f0b429;color:#1a1300;padding:0 6px;border-radius:6px;font-weight:700}
.tk-ts.now{box-shadow:0 0 0 2px var(--brass) inset}
.tk-ts.now::before{content:"NOW";position:absolute;top:-9px;left:6px;font-family:var(--display);font-size:10px;background:var(--brass);color:#1a1405;padding:0 6px;border-radius:6px}
.tk-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.tk-grid2{grid-template-columns:1fr}}
.tk-tasks{display:flex;flex-wrap:wrap;gap:6px}
.tk-task{background:#252b32;border:1px solid var(--line);font-size:13px;padding:3px 10px;border-radius:20px}
.tk-todo,.tk-tips{margin:0;padding-left:1.2em;font-size:14px;line-height:1.7;display:grid;gap:4px}
.tk-todo li::marker,.tk-tips li::marker{color:var(--brass)}
.tk-todo strong,.tk-tips strong{color:#f0b429}
.tk-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.tk-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tk-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tk-tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:13px;background:var(--panel)}
.tk-tbl th,.tk-tbl td{white-space:nowrap;padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.tk-tbl th{background:#252b32;font-family:var(--display);color:var(--muted);font-weight:500;position:static}
.tk-tbl td:first-child,.tk-tbl td:nth-child(2){font-weight:700}
.tk-tbl tr.cur td{background:#2b2a1d}
.tk-cell{display:inline-block;min-width:48px;padding:1px 5px;border-radius:4px;font-size:12px;font-weight:700;color:#111}
.tk-cell.m{outline:2px solid #f0b429;outline-offset:1px}
@media (max-width:480px){.tk-tab{font-size:12px}.tk-tab small{font-size:9px}.tk-dayname{font-size:24px}}

.sv-ov p{margin:0 0 4px}
.sv-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.sv-d{background:#2a3a2a;border:1px solid #3e5a3e;border-radius:5px;text-align:center;padding:6px 0;font-weight:700;font-size:13px}
.sv-d.battle{background:#4a2420;border-color:#e0675e;color:#ffd2cc}
.sv-weeklab{display:grid;grid-template-columns:6fr 1fr;gap:4px;font-size:12px;margin-top:4px}
.sv-a{color:#8fbf5a;text-align:center;border-top:2px solid #8fbf5a;padding-top:2px}
.sv-b{color:#e0675e;text-align:center;border-top:2px solid #e0675e;padding-top:2px;font-size:11px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.sv-lead{margin:0 0 8px !important;color:var(--muted)}
.sv-tasks{margin:0;padding-left:1.6em;display:grid;gap:6px;font-size:14px}
.sv-tasks li::marker{color:var(--muted);font-family:var(--display)}
.sv-tasks li.must{font-weight:700;color:#ffe0a8}
.sv-tasks li.must::marker{color:#f0b429}
.sv-badge{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;background:#f0b429;color:#1a1300;border-radius:999px;padding:0 8px;vertical-align:1px}
.sv-must{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sv-mcard{background:var(--panel);border:1px solid #6b5520;border-top:4px solid #f0b429;border-radius:8px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.sv-num{font-family:var(--display);font-size:22px;color:#f0b429;line-height:1}
.sv-mcard h4{margin:0;font-size:15px}
.sv-mcard p{margin:0;font-size:14px;color:#d2d6db;line-height:1.65}
.sv-sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media(max-width:700px){.sv-sides{grid-template-columns:1fr}}
.sv-side{background:var(--panel);border:1px solid var(--line);border-left:5px solid;border-radius:8px;padding:12px 14px}
.sv-side.def{border-left-color:#5fa8d9}.sv-side.off{border-left-color:#e0675e}
.sv-side h4{margin:0 0 6px;font-size:16px}.sv-side.def h4{color:#5fa8d9}.sv-side.off h4{color:#e0675e}
.sv-side p{margin:0;font-size:14px;line-height:1.7}
.sv-fig{max-width:720px}

.rc-plain{margin:0;font-size:15px;line-height:1.75;max-width:70ch}
.cc-sched{margin-top:16px;background:#252b32;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.cc-schedT{margin:0;font-size:15px;color:#f0a868}
.cc-teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc-team{background:#1b1f24;border:1px solid #6b3a1a;border-radius:6px;padding:10px;text-align:center}
.cc-tname{font-weight:700;font-size:14px;color:#f0a868}
.cc-tat{font-family:var(--display);font-size:26px;line-height:1.2}
.cc-tloc{font-size:12px;color:var(--muted)}
.cc-vote{margin:0;background:rgba(224,103,94,.12);border-left:3px solid var(--no);border-radius:4px;padding:8px 10px;font-size:14px;line-height:1.6}

.hq-calc{display:grid;gap:10px}
.hq-sel{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.hq-field{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.hq-field select{font:inherit;font-size:15px;color:var(--ink);background:#252b32;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.hq-arrow{color:var(--brass);font-size:20px;padding-bottom:6px}
.hq-tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hq-totc{background:#252b32;border-radius:6px;padding:8px 10px;display:grid}
.hq-totc .k{font-size:11px;color:var(--muted)}
.hq-totc .v{font-family:var(--display);font-size:22px;color:var(--brass);font-variant-numeric:tabular-nums}
@media(max-width:480px){.hq-tot{grid-template-columns:1fr}}
.hq-tbl{min-width:600px}
.hq-tbl td.lv{font-family:var(--display);font-weight:700;color:var(--brass)}
.hq-tbl td.num{font-variant-numeric:tabular-nums}
.hq-tbl td.pre{text-align:left;white-space:normal}
.hq-tbl tr.sel td{background:#2b2a1d}
.hq-chip{display:inline-block;background:#252b32;border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap}
.note a{color:var(--brass)}
@media(max-width:560px){
 .hq-tbl{min-width:0}
 .hq-tbl tr:first-child{display:none}
 .hq-tbl tr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;padding:10px 12px;border-bottom:1px solid var(--line)}
 .hq-tbl td{border:0;padding:0;text-align:left}
 .hq-tbl td.lv{grid-column:1/-1;font-size:18px}
 .hq-tbl td.num::before{content:attr(data-l);display:block;font-size:10px;color:var(--muted);font-weight:400}
 .hq-tbl td.pre{grid-column:1/-1;margin-top:4px}
}
.upd-banner{display:flex;align-items:center;gap:10px;background:#2b2a1d;border:1px solid #6b5520;border-left:5px solid var(--brass);border-radius:8px;padding:10px 14px;font-size:17px;font-weight:700;color:var(--brass)}
.upd-ico{font-size:20px}
.li-fig{margin:10px 0 2px;max-width:420px;grid-column:2}
.li-fig figcaption{color:#d9b0a8}
.hq-ref{display:flex;gap:10px;align-items:flex-start;background:#2b2a1d;border:1px solid #6b5520;border-left:5px solid var(--brass);border-radius:8px;padding:10px 14px;font-size:15px;font-weight:700;color:#f0d08a;line-height:1.6}
.hq-ref-i{color:var(--brass);font-size:18px;line-height:1.3}

const RULES = {"tab": {"ja": "ルール", "en": "Rules", "ko": "규칙", "zh": "规则", "es": "Reglas", "it": "Regole", "fr": "Règles", "vi": "Luật", "th": "กฎ", "id": "Aturan", "tl": "Patakaran"}, "heli": {"title": {"ja": "ヘリルール", "en": "Helicopter rules", "ko": "헬기 규칙", "zh": "直升机规则", "es": "Reglas del helicóptero", "it": "Regole dell'elicottero", "fr": "Règles de l'hélicoptère", "vi": "Luật trực thăng", "th": "กฎเฮลิคอปเตอร์", "id": "Aturan helikopter", "tl": "Mga patakaran sa helicopter"}, "items": {"ja": ["ヘリはヘリを出したオーナーが最初に乗り込みタイマーをスタートさせます。", "それ以外の人は増援加速を使ってなるべく早くヘリへ移動しヘリの外(下部)で待機します。", "ヘリへの全員到着を待って合図があったら一斉に乗り込みます。", "乗り込み遅れた場合でも、残り10秒での乗り込みは禁止です。外に出てくることも禁止です。(タップの邪魔になります)", "移動に大幅に遅れた場合はタンクを送らずタップのみ参加しましょう。", "タップの邪魔にならないように、ヘリの近くを動かないでください。"], "en": ["The owner who launched the helicopter boards first and starts the timer.", "Everyone else uses reinforcement speed-ups to reach the helicopter as fast as possible and waits outside it (below).", "Wait until everyone has arrived, then board all together on the signal.", "Even if you are late, boarding in the last 10 seconds is not allowed. Leaving the helicopter is not allowed either (it gets in the way of tapping).", "If you are far behind getting there, don't send a tank. Join by tapping only.", "Don't move around near the helicopter, so you don't get in the way of tapping."], "ko": ["헬기를 띄운 오너가 가장 먼저 탑승해 타이머를 시작합니다.", "다른 사람은 증원 가속을 사용해 최대한 빨리 헬기로 이동하고, 헬기 밖(아래쪽)에서 대기합니다.", "모두 도착할 때까지 기다렸다가 신호가 나오면 다 함께 탑승합니다.", "탑승이 늦어도 남은 10초 이내에는 탑승할 수 없습니다. 밖으로 나오는 것도 금지입니다. (탭에 방해가 됩니다)", "이동이 크게 늦었다면 탱크는 보내지 말고 탭으로만 참여하세요.", "탭에 방해가 되지 않도록 헬기 근처에서 움직이지 마세요."], "zh": ["由开启直升机的机主最先上机，并启动计时。", "其他人使用增援加速尽快赶到直升机，在直升机外（下方）等待。", "等所有人到齐后，听到信号再一起上机。", "即使上机晚了，最后10秒内也禁止上机，也禁止从里面出来。（会妨碍点击）", "如果赶路严重迟到，就不要派坦克，只参与点击。", "为了不妨碍点击，请不要在直升机附近移动。"], "es": ["El dueño que lanza el helicóptero sube primero e inicia el temporizador.", "Los demás usan aceleradores de refuerzo para llegar al helicóptero lo antes posible y esperan fuera (debajo).", "Esperen a que lleguen todos y, a la señal, suban todos a la vez.", "Aunque llegues tarde, está prohibido subir en los últimos 10 segundos. También está prohibido salir (estorba al tapeo).", "Si llegas muy tarde, no envíes tanque: participa solo tocando.", "No te muevas cerca del helicóptero para no estorbar al tapeo."], "it": ["Il proprietario che lancia l'elicottero sale per primo e avvia il timer.", "Gli altri usano gli acceleratori di rinforzo per raggiungere l'elicottero il prima possibile e aspettano fuori (sotto).", "Aspettate che arrivino tutti e, al segnale, salite tutti insieme.", "Anche se sei in ritardo, è vietato salire negli ultimi 10 secondi. È vietato anche uscire (disturba il tapping).", "Se sei molto in ritardo, non inviare il carro armato: partecipa solo con i tap.", "Non muoverti vicino all'elicottero, per non disturbare il tapping."], "fr": ["Le propriétaire qui lance l'hélicoptère monte en premier et démarre le minuteur.", "Les autres utilisent des accélérateurs de renfort pour rejoindre l'hélicoptère au plus vite et attendent à l'extérieur (en dessous).", "Attendez que tout le monde soit arrivé, puis montez tous ensemble au signal.", "Même en retard, il est interdit de monter dans les 10 dernières secondes. Il est aussi interdit de sortir (cela gêne les taps).", "Si vous êtes très en retard, n'envoyez pas de tank : participez seulement en tapant.", "Ne bougez pas près de l'hélicoptère pour ne pas gêner les taps."], "vi": ["Chủ trực thăng lên trước và bắt đầu đếm giờ.", "Những người khác dùng tăng tốc tiếp viện để đến trực thăng nhanh nhất có thể và chờ bên ngoài (phía dưới).", "Chờ mọi người đến đủ, khi có hiệu lệnh thì cùng lên một lượt.", "Dù lên muộn, cấm lên trong 10 giây cuối. Cũng cấm ra ngoài (gây cản trở việc bấm).", "Nếu đến quá muộn, đừng gửi xe tăng, chỉ tham gia bằng cách bấm.", "Đừng di chuyển gần trực thăng để không cản trở việc bấm."], "th": ["เจ้าของที่ปล่อยเฮลิคอปเตอร์ขึ้นก่อนและเริ่มจับเวลา", "คนอื่นใช้ไอเทมเร่งความเร็วกำลังเสริม รีบไปที่เฮลิคอปเตอร์ให้เร็วที่สุด แล้วรออยู่ด้านนอก (ด้านล่าง)", "รอจนทุกคนมาครบ เมื่อได้สัญญาณแล้วขึ้นพร้อมกัน", "แม้จะขึ้นช้า ห้ามขึ้นในช่วง 10 วินาทีสุดท้าย และห้ามออกมาด้านนอกด้วย (จะรบกวนการแตะ)", "ถ้าเดินทางช้ามาก อย่าส่งรถถัง ให้ร่วมแค่การแตะ", "อย่าเคลื่อนที่ใกล้เฮลิคอปเตอร์ เพื่อไม่ให้รบกวนการแตะ"], "id": ["Pemilik yang mengeluarkan helikopter naik pertama dan memulai timer.", "Yang lain memakai percepatan bala bantuan untuk secepatnya menuju helikopter dan menunggu di luar (bagian bawah).", "Tunggu sampai semua tiba, lalu naik bersamaan saat ada aba-aba.", "Meskipun terlambat, dilarang naik di 10 detik terakhir. Keluar juga dilarang (mengganggu tap).", "Jika sangat terlambat, jangan kirim tank; ikut tap saja.", "Jangan bergerak di dekat helikopter agar tidak mengganggu tap."], "tl": ["Ang may-ari na naglabas ng helicopter ang unang sasakay at magsisimula ng timer.", "Ang iba ay gagamit ng reinforcement speed-up para makarating agad sa helicopter at maghihintay sa labas (sa ibaba).", "Hintayin na dumating ang lahat, at sabay-sabay sumakay kapag may hudyat.", "Kahit nahuli, bawal sumakay sa huling 10 segundo. Bawal ding lumabas (nakakaabala ito sa pag-tap).", "Kung sobrang nahuli, huwag nang magpadala ng tank; mag-tap na lang.", "Huwag gumalaw malapit sa helicopter para hindi makaabala sa pag-tap."]}, "warn": [3, 5], "caption": {"ja": "イメージ：全員がヘリの外（周り）に到着して待機している状態（②）", "en": "Example: everyone has arrived and is waiting outside, around the helicopter (rule 2)", "ko": "예시: 모두 헬기 밖(주변)에 도착해 대기하는 모습 (②)", "zh": "示意：所有人已到达，在直升机外（周围）等待（②）", "es": "Ejemplo: todos han llegado y esperan fuera, alrededor del helicóptero (regla 2)", "it": "Esempio: tutti sono arrivati e aspettano fuori, intorno all'elicottero (regola 2)", "fr": "Exemple : tout le monde est arrivé et attend à l'extérieur, autour de l'hélicoptère (règle 2)", "vi": "Minh họa: mọi người đã đến và đang chờ bên ngoài, xung quanh trực thăng (luật 2)", "th": "ภาพตัวอย่าง: ทุกคนมาถึงแล้วและรออยู่ด้านนอกรอบเฮลิคอปเตอร์ (ข้อ 2)", "id": "Contoh: semua sudah tiba dan menunggu di luar, di sekitar helikopter (aturan 2)", "tl": "Halimbawa: dumating na ang lahat at naghihintay sa labas, sa paligid ng helicopter (patakaran 2)"}}, "tyrant": {"title": {"ja": "ゾンビ暴君", "en": "Zombie Tyrant", "ko": "좀비 폭군", "zh": "僵尸暴君", "es": "Tirano Zombi", "it": "Tiranno Zombi", "fr": "Tyran Zombie", "vi": "Bạo chúa Zombie", "th": "ทรราชซอมบี้", "id": "Tiran Zombi", "tl": "Zombie Tyrant"}, "items": {"ja": ["時間は固定で、AT 9:00 に行われます。曜日は決まっていないので、毎回ゲーム内で確認してください。", "あなたの時間では：{local}", "渓谷戦とゾンビ暴君のタイミングが重なる場合、ゾンビ暴君は AT 8:30（あなたの時間：{L:510}）に調整されます。", "集結募集は、ゾンビ暴君の近く（HQ 3個分程度以内）にいる人が行います。", "HQ 3個分程度はあくまで大体の目安です。その時のオンライン状況によっても変わるので、臨機応変に判断してください。", "遠くにいる人は集結募集をせず、集結に参加しましょう。", "参加できる集結が足りない場合は、遠くても集結募集をしましょう。", "※ラリーは下から（古いものから）順番に参加しましょう。", "元々ゾンビ暴君がいた場所、またはゾンビSPOTのピンが打たれている場所は開けておきましょう。", "事前に戦争狂熱バフと首都バフを獲得しておくと、より高得点を得られます。"], "en": ["It always starts at AT 9:00. The day of the week is not fixed, so check in the game each time.", "In your time: {local}", "If Canyon Clash and the Zombie Tyrant overlap, the Zombie Tyrant is moved to AT 8:30 (your time: {L:510}).", "The rally should be started by someone close to the Zombie Tyrant (within about 3 HQs).", "About 3 HQs is only a rough guide. It changes with who is online at the time, so be flexible.", "If you are far away, don't start a rally; join one instead.", "If there aren't enough rallies to join, start one even if you are far away.", "Note: Join rallies from the bottom up (oldest first).", "Keep the spot where the Zombie Tyrant was, or any spot marked with a Zombie SPOT pin, clear.", "Get the War Frenzy buff and the capital buff beforehand to score higher."], "ko": ["시간은 AT 9:00으로 고정입니다. 요일은 정해져 있지 않으니 매번 게임에서 확인하세요.", "당신의 시간: {local}", "협곡전과 좀비 폭군 시간이 겹치면 좀비 폭군은 AT 8:30(당신의 시간: {L:510})으로 조정됩니다.", "집결 모집은 좀비 폭군 가까이(HQ 3개 정도 이내)에 있는 사람이 합니다.", "HQ 3개 정도는 어디까지나 대략적인 기준입니다. 그때의 접속 상황에 따라 달라지니 상황에 맞게 판단하세요.", "멀리 있는 사람은 집결 모집을 하지 말고 집결에 참여하세요.", "참여할 집결이 부족하면 멀더라도 집결 모집을 하세요.", "※ 랠리는 아래부터(오래된 것부터) 순서대로 참여하세요.", "원래 좀비 폭군이 있던 자리나 좀비 SPOT 핀이 찍힌 자리는 비워 두세요.", "미리 전쟁 열광 버프와 수도 버프를 받아 두면 더 높은 점수를 얻을 수 있습니다."], "zh": ["时间固定为AT 9:00。星期不固定，请每次在游戏内确认。", "你的时间：{local}", "如果峡谷战与僵尸暴君时间重叠，僵尸暴君会调整为AT 8:30（你的时间：{L:510}）。", "由距离僵尸暴君较近（约3个HQ以内）的人发起集结。", "约3个HQ只是大致的参考。会随当时在线情况变化，请灵活判断。", "距离较远的人不要发起集结，请参加集结。", "如果可参加的集结不够，即使距离远也请发起集结。", "※请从下往上（从最早的开始）依次参加集结。", "请把僵尸暴君原来所在的位置，或标有僵尸SPOT图钉的位置空出来。", "提前获得战争狂热增益和首都增益，可以拿到更高的分数。"], "es": ["Siempre empieza a las 9:00 AT. El día de la semana no es fijo, así que compruébalo en el juego cada vez.", "En tu hora: {local}", "Si Canyon Clash coincide con el Tirano Zombi, el Tirano Zombi se adelanta a las 8:30 AT (tu hora: {L:510}).", "La concentración la inicia quien esté cerca del Tirano Zombi (a unos 3 HQ como máximo).", "Unos 3 HQ es solo una guía aproximada. Cambia según quién esté conectado en ese momento, así que sé flexible.", "Si estás lejos, no inicies una concentración; únete a una.", "Si no hay suficientes concentraciones para unirse, iníciala aunque estés lejos.", "Nota: únete a las concentraciones de abajo arriba (primero las más antiguas).", "Deja libre el lugar donde estaba el Tirano Zombi o cualquier lugar marcado con un pin de Zombi SPOT.", "Consigue antes el bonus de Frenesí de Guerra y el bonus de capital para sumar más puntos."], "it": ["Inizia sempre alle 9:00 AT. Il giorno della settimana non è fisso, quindi controllalo ogni volta nel gioco.", "Nel tuo orario: {local}", "Se Canyon Clash si sovrappone al Tiranno Zombi, il Tiranno Zombi viene spostato alle 8:30 AT (tua ora: {L:510}).", "Il raduno lo avvia chi è vicino al Tiranno Zombi (entro circa 3 HQ).", "Circa 3 HQ è solo un'indicazione. Cambia in base a chi è online in quel momento, quindi regolati di volta in volta.", "Se sei lontano, non avviare un raduno: unisciti a uno.", "Se non ci sono abbastanza raduni a cui unirsi, avvialo anche se sei lontano.", "Nota: unisciti ai raduni dal basso verso l'alto (prima i più vecchi).", "Lascia libero il punto in cui si trovava il Tiranno Zombi o qualsiasi punto segnato con un segnaposto Zombi SPOT.", "Ottieni prima il bonus Frenesia di Guerra e il bonus capitale per fare più punti."], "fr": ["Il commence toujours à 9:00 AT. Le jour de la semaine n'est pas fixe : vérifiez dans le jeu à chaque fois.", "À votre heure : {local}", "Si Canyon Clash et le Tyran Zombie tombent en même temps, le Tyran Zombie est avancé à 8:30 AT (votre heure : {L:510}).", "Le rassemblement est lancé par quelqu'un proche du Tyran Zombie (à environ 3 HQ maximum).", "Environ 3 HQ n'est qu'un repère. Cela dépend de qui est en ligne à ce moment-là : adaptez-vous.", "Si vous êtes loin, ne lancez pas de rassemblement : rejoignez-en un.", "S'il n'y a pas assez de rassemblements à rejoindre, lancez-en un même si vous êtes loin.", "Remarque : rejoignez les rassemblements du bas vers le haut (les plus anciens d'abord).", "Laissez libre l'emplacement où se trouvait le Tyran Zombie, ou tout endroit marqué d'une épingle Zombie SPOT.", "Obtenez à l'avance le bonus Frénésie de guerre et le bonus de capitale pour marquer plus de points."], "vi": ["Luôn bắt đầu lúc 9:00 AT. Ngày trong tuần không cố định, nên hãy kiểm tra trong game mỗi lần.", "Theo giờ của bạn: {local}", "Nếu Canyon Clash trùng giờ với Bạo chúa Zombie, Bạo chúa Zombie sẽ được dời sang 8:30 AT (giờ của bạn: {L:510}).", "Người ở gần Bạo chúa Zombie (trong khoảng 3 HQ) sẽ mở tập kết.", "Khoảng 3 HQ chỉ là mức tham khảo. Tùy tình hình online lúc đó mà thay đổi, hãy linh hoạt.", "Người ở xa đừng mở tập kết, hãy tham gia tập kết.", "Nếu không đủ tập kết để tham gia, hãy mở tập kết dù ở xa.", "Lưu ý: tham gia tập kết từ dưới lên (cái cũ nhất trước).", "Hãy để trống vị trí Bạo chúa Zombie từng ở, hoặc vị trí có ghim Zombie SPOT.", "Nhận trước buff Cuồng nhiệt Chiến tranh và buff thủ đô để được điểm cao hơn."], "th": ["เริ่มเวลา 9:00 AT เสมอ วันในสัปดาห์ไม่แน่นอน จึงต้องตรวจสอบในเกมทุกครั้ง", "ตามเวลาของคุณ: {local}", "ถ้า Canyon Clash ตรงกับเวลาทรราชซอมบี้ ทรราชซอมบี้จะเลื่อนเป็น 8:30 AT (เวลาของคุณ: {L:510})", "ผู้ที่อยู่ใกล้ทรราชซอมบี้ (ห่างไม่เกินประมาณ 3 HQ) เป็นผู้เปิดรวมพล", "ประมาณ 3 HQ เป็นเพียงเกณฑ์คร่าว ๆ ขึ้นอยู่กับว่าใครออนไลน์อยู่ในตอนนั้น จึงควรปรับตามสถานการณ์", "ผู้ที่อยู่ไกลไม่ต้องเปิดรวมพล ให้เข้าร่วมรวมพลแทน", "ถ้ารวมพลที่เข้าร่วมได้มีไม่พอ ให้เปิดรวมพลแม้จะอยู่ไกล", "※ เข้าร่วมรวมพลจากด้านล่างขึ้นไป (อันที่เก่าที่สุดก่อน)", "เว้นที่ว่างไว้ตรงจุดที่ทรราชซอมบี้เคยอยู่ หรือจุดที่ปักหมุด Zombie SPOT ไว้", "รับบัฟคลั่งสงครามและบัฟเมืองหลวงไว้ก่อน จะได้คะแนนสูงขึ้น"], "id": ["Selalu dimulai pukul 9:00 AT. Harinya tidak tetap, jadi cek di dalam game setiap kali.", "Di waktu Anda: {local}", "Jika Canyon Clash bertabrakan dengan Tiran Zombi, Tiran Zombi diatur ke pukul 8:30 AT (waktu Anda: {L:510}).", "Rally dibuka oleh orang yang dekat dengan Tiran Zombi (sekitar 3 HQ).", "Sekitar 3 HQ hanya patokan kasar. Bisa berubah tergantung siapa yang online saat itu, jadi bersikaplah fleksibel.", "Jika jauh, jangan membuka rally; ikutlah rally.", "Jika rally yang bisa diikuti kurang, bukalah rally meskipun jauh.", "Catatan: ikuti rally dari bawah ke atas (yang paling lama dulu).", "Biarkan kosong tempat Tiran Zombi semula berada, atau tempat yang ditandai pin Zombi SPOT.", "Ambil buff Kegilaan Perang dan buff ibu kota lebih dulu untuk skor lebih tinggi."], "tl": ["Laging nagsisimula sa 9:00 AT. Hindi pare-pareho ang araw, kaya tingnan sa laro tuwing magkakaroon.", "Sa oras mo: {local}", "Kapag sabay ang Canyon Clash at Zombie Tyrant, ililipat ang Zombie Tyrant sa 8:30 AT (oras mo: {L:510}).", "Ang magbubukas ng rally ay ang nasa malapit sa Zombie Tyrant (mga 3 HQ ang layo).", "Gabay lang ang mga 3 HQ. Nag-iiba ito depende sa kung sino ang online sa oras na iyon, kaya maging flexible.", "Kung malayo ka, huwag nang magbukas ng rally; sumali na lang.", "Kung kulang ang rally na puwedeng salihan, magbukas ng rally kahit malayo ka.", "Paalala: sumali sa mga rally mula sa ibaba pataas (pinakaluma muna).", "Iwanang bakante ang dating puwesto ng Zombie Tyrant, o ang puwestong may Zombie SPOT pin.", "Kunin muna ang War Frenzy buff at capital buff para mas mataas ang score."]}, "warn": [8], "local": [1], "caption": {"ja": "参考：集結募集するエリアの大体の目安（赤いHQ＝ゾンビ暴君の近くにいる人）", "en": "Reference: rough guide to the area that starts rallies (red HQs = players close to the Zombie Tyrant)", "ko": "참고: 집결 모집을 하는 구역의 대략적인 기준 (빨간 HQ = 좀비 폭군 근처에 있는 사람)", "zh": "参考：发起集结区域的大致范围（红色HQ＝靠近僵尸暴君的人）", "es": "Referencia: zona aproximada que inicia concentraciones (HQ rojos = jugadores cerca del Tirano Zombi)", "it": "Riferimento: zona indicativa che avvia i raduni (HQ rossi = giocatori vicini al Tiranno Zombi)", "fr": "Référence : zone indicative qui lance les rassemblements (HQ rouges = joueurs proches du Tyran Zombie)", "vi": "Tham khảo: khu vực mở tập kết (ước chừng) (HQ đỏ = người ở gần Bạo chúa Zombie)", "th": "ตัวอย่าง: พื้นที่เปิดรวมพลโดยประมาณ (HQ สีแดง = ผู้ที่อยู่ใกล้ทรราชซอมบี้)", "id": "Referensi: perkiraan area yang membuka rally (HQ merah = pemain dekat Tiran Zombi)", "tl": "Reference: tinatayang lugar na magbubukas ng rally (pulang HQ = mga player na malapit sa Zombie Tyrant)"}, "tip": [9], "at": 540, "liImg": {"8": "spot"}, "liCap": {"ja": "参考：元々ゾンビ暴君がいた場所（旗の位置）を開けておいた状態", "en": "Example: the spot where the Zombie Tyrant was (at the flag) is left open", "ko": "참고: 원래 좀비 폭군이 있던 자리(깃발 위치)를 비워 둔 모습", "zh": "参考：僵尸暴君原来所在的位置（旗帜处）已空出", "es": "Ejemplo: el lugar donde estaba el Tirano Zombi (en la bandera) queda libre", "it": "Esempio: il punto dove si trovava il Tiranno Zombi (alla bandiera) è lasciato libero", "fr": "Exemple : l'emplacement où se trouvait le Tyran Zombie (au drapeau) est laissé libre", "vi": "Ví dụ: vị trí Bạo chúa Zombie từng ở (chỗ lá cờ) được để trống", "th": "ตัวอย่าง: เว้นที่ว่างตรงจุดที่ทรราชซอมบี้เคยอยู่ (ตรงธง)", "id": "Contoh: tempat Tiran Zombi semula berada (di bendera) dibiarkan kosong", "tl": "Halimbawa: bakante ang dating puwesto ng Zombie Tyrant (sa may bandila)"}}, "siege": {"title": {"ja": "ゾンビ攻城", "en": "Zombie Siege", "ko": "좀비 공성", "zh": "僵尸攻城", "es": "Asedio Zombi", "it": "Assedio Zombi", "fr": "Siège Zombie", "vi": "Zombie Công thành", "th": "ซอมบี้บุกเมือง", "id": "Pengepungan Zombi", "tl": "Zombie Siege"}, "items": {"ja": ["攻城ゾンビは AT 9:30 から開始します。", "あなたの時間では：{local}", "開始時刻までに、すべてのタンクを戻してください。", "※R4・R5は、開始前に同盟の食料と木材を削除してください。", "仲間のHQが燃えそうな場合は、必要であれば増援を入れてあげてください。", "事前に首都バフと戦争狂熱バフを獲得しておくと、より多くのステージへ到達できる可能性が高まります。", "※終了後に燃えているHQは自然に鎮火します。ダイヤを使わないように！"], "en": ["The siege zombies start at AT 9:30.", "In your time: {local}", "Bring all your tanks home before the start time.", "R4s and R5s: delete the alliance food and wood before it starts.", "If a teammate's HQ is about to burn, send reinforcements if needed.", "Getting the capital buff and the War Frenzy buff beforehand improves your chances of reaching more stages.", "Note: HQs still burning after it ends will go out on their own. Don't spend diamonds!"], "ko": ["공성 좀비는 AT 9:30에 시작합니다.", "당신의 시간: {local}", "시작 시각까지 모든 탱크를 귀환시키세요.", "※ R4·R5는 시작 전에 동맹 식량과 목재를 삭제하세요.", "동료의 HQ가 불탈 것 같으면 필요할 때 증원을 보내 주세요.", "미리 수도 버프와 전쟁 열광 버프를 받아 두면 더 많은 스테이지에 도달할 가능성이 높아집니다.", "※ 종료 후 불타고 있는 HQ는 자연히 꺼집니다. 다이아를 쓰지 마세요!"], "zh": ["攻城僵尸从AT 9:30开始。", "你的时间：{local}", "请在开始前召回所有坦克。", "※R4、R5请在开始前删除同盟的粮食和木材。", "如果队友的HQ快要着火，必要时请派遣增援。", "提前获得首都增益和战争狂热增益，更有可能到达更多关卡。", "※结束后仍在燃烧的HQ会自然熄灭。不要使用钻石！"], "es": ["Los zombis de asedio empiezan a las 9:30 AT.", "En tu hora: {local}", "Haz volver todos tus tanques antes de la hora de inicio.", "R4 y R5: borrad la comida y la madera de la alianza antes de que empiece.", "Si el HQ de un compañero está a punto de arder, envíale refuerzos si hace falta.", "Conseguir antes el bonus de capital y el de Frenesí de Guerra aumenta las posibilidades de llegar a más fases.", "Nota: los HQ que sigan ardiendo al terminar se apagan solos. ¡No gastes diamantes!"], "it": ["Gli zombi d'assedio iniziano alle 9:30 AT.", "Nel tuo orario: {local}", "Richiama tutti i carri armati prima dell'orario di inizio.", "R4 e R5: eliminate il cibo e il legno dell'alleanza prima dell'inizio.", "Se l'HQ di un compagno sta per bruciare, invia rinforzi se serve.", "Ottenere prima il bonus capitale e il bonus Frenesia di Guerra aumenta le probabilità di raggiungere più fasi.", "Nota: gli HQ ancora in fiamme a fine evento si spengono da soli. Non usare diamanti!"], "fr": ["Les zombies de siège commencent à 9:30 AT.", "À votre heure : {local}", "Rappelez tous vos tanks avant l'heure de début.", "R4 et R5 : supprimez la nourriture et le bois de l'alliance avant le début.", "Si le HQ d'un coéquipier risque de brûler, envoyez des renforts si nécessaire.", "Obtenir à l'avance le bonus de capitale et le bonus Frénésie de guerre augmente vos chances d'atteindre plus de vagues.", "Remarque : les HQ encore en feu à la fin s'éteignent tout seuls. N'utilisez pas de diamants !"], "vi": ["Zombie công thành bắt đầu lúc 9:30 AT.", "Theo giờ của bạn: {local}", "Hãy cho tất cả xe tăng quay về trước giờ bắt đầu.", "R4, R5: hãy xóa lương thực và gỗ của liên minh trước khi bắt đầu.", "Nếu HQ của đồng đội sắp bị cháy, hãy gửi tiếp viện nếu cần.", "Nhận trước buff thủ đô và buff Cuồng nhiệt Chiến tranh sẽ tăng khả năng đạt được nhiều màn hơn.", "Lưu ý: HQ còn cháy sau khi kết thúc sẽ tự tắt. Đừng dùng kim cương!"], "th": ["ซอมบี้บุกเมืองเริ่มเวลา 9:30 AT", "ตามเวลาของคุณ: {local}", "เรียกรถถังทั้งหมดกลับก่อนเวลาเริ่ม", "※ R4 และ R5 ให้ลบอาหารและไม้ของพันธมิตรก่อนเริ่ม", "ถ้า HQ ของเพื่อนใกล้จะถูกเผา ให้ส่งกำลังเสริมไปช่วยถ้าจำเป็น", "รับบัฟเมืองหลวงและบัฟคลั่งสงครามไว้ก่อน จะมีโอกาสไปถึงด่านได้มากขึ้น", "※ HQ ที่ยังไฟไหม้อยู่หลังจบจะดับเอง อย่าใช้เพชร!"], "id": ["Zombi pengepung mulai pukul 9:30 AT.", "Di waktu Anda: {local}", "Tarik pulang semua tank sebelum waktu mulai.", "R4 dan R5: hapus makanan dan kayu aliansi sebelum mulai.", "Jika HQ rekan hampir terbakar, kirim bala bantuan bila perlu.", "Mengambil buff ibu kota dan buff Kegilaan Perang lebih dulu meningkatkan peluang mencapai lebih banyak tahap.", "Catatan: HQ yang masih terbakar setelah selesai akan padam sendiri. Jangan pakai berlian!"], "tl": ["Nagsisimula ang siege zombies sa 9:30 AT.", "Sa oras mo: {local}", "Pauwiin ang lahat ng tank bago ang oras ng simula.", "Para sa R4 at R5: burahin ang pagkain at kahoy ng alliance bago magsimula.", "Kung malapit nang masunog ang HQ ng kasama, magpadala ng reinforcement kung kailangan.", "Kapag kinuha muna ang capital buff at War Frenzy buff, mas malaki ang tsansang makaabot sa mas maraming stage.", "Paalala: kusang mamamatay ang apoy sa mga HQ pagkatapos nito. Huwag gumamit ng diamond!"]}, "warn": [2, 3, 6], "tip": [5], "local": [1], "at": 570}, "rank": {"title": {"ja": "同盟ランク", "en": "Alliance rank", "ko": "동맹 계급", "zh": "同盟阶级", "es": "Rango en la alianza", "it": "Grado nell'alleanza", "fr": "Rang dans l'alliance", "vi": "Cấp bậc liên minh", "th": "ยศในพันธมิตร", "id": "Pangkat aliansi", "tl": "Ranggo sa alliance"}, "items": {"ja": ["昇格・降格は、AvAポイント、同盟技術への寄付、投票への回答を基準にしたポイント制で、定期的に決定されます。"], "en": ["Promotions and demotions are decided regularly with a points system based on AvA points, donations to alliance tech, and answering polls."], "ko": ["승급·강등은 AvA 포인트, 동맹 기술 기부, 투표 응답을 기준으로 한 포인트제로 정기적으로 결정됩니다."], "zh": ["晋升和降级按积分制定期决定，积分依据AvA积分、同盟科技捐献和投票回复。"], "es": ["Los ascensos y descensos se deciden periódicamente con un sistema de puntos basado en los puntos AvA, las donaciones a la tecnología de la alianza y las respuestas a las votaciones."], "it": ["Promozioni e retrocessioni vengono decise periodicamente con un sistema a punti basato su punti AvA, donazioni alla tecnologia dell'alleanza e risposte ai sondaggi."], "fr": ["Les promotions et rétrogradations sont décidées régulièrement selon un système de points basé sur les points AvA, les dons à la technologie d'alliance et les réponses aux sondages."], "vi": ["Việc thăng cấp và giáng cấp được quyết định định kỳ theo hệ thống điểm, dựa trên điểm AvA, quyên góp công nghệ liên minh và trả lời bình chọn."], "th": ["การเลื่อนยศและลดยศตัดสินเป็นระยะด้วยระบบคะแนน โดยดูจากคะแนน AvA การบริจาคเทคโนโลยีพันธมิตร และการตอบโหวต"], "id": ["Kenaikan dan penurunan pangkat diputuskan secara berkala dengan sistem poin berdasarkan poin AvA, donasi teknologi aliansi, dan jawaban polling."], "tl": ["Regular na pinagpapasyahan ang promotion at demotion gamit ang point system batay sa AvA points, donasyon sa alliance tech, at pagsagot sa mga poll."]}, "warn": [], "plain": true}};
const CANYON = {"ja": {"card": "渓谷戦（キャニオン・クラッシュ）", "title": "キャニオン・クラッシュ 作戦", "sub": "Last Z ・ 4部隊 ・ 5フェーズ ・ 1つの作戦", "phase": "フェーズ", "phases": [["配置につく", "各自のポジションへテレポート。**野戦病院と浄水施設を占領**する。"], ["キャニオンキャプテン出現", "**A・B部隊の3番と4番**はキャプテンへテレポートして攻撃。それ以外の全員は建物の確保と敵HQへの攻撃を続ける。"], ["軍事基地が開放", "**C・D部隊の隊長と2番**は、自陣近くの軍事基地へテレポートし、占領して確保する。"], ["パワーコア（残り約20分）", "**残り21分**で、全部隊の隊長・2番・3番が中央へテレポート。**隊長と2番：**パワーコア周辺の戦車だけを攻撃し、コアを出現地点まで護衛。**3番：**パワーコア周辺の敵HQだけを攻撃。**4番と5番：**その場に残り建物の確保を続ける。"], ["リセットして守る", "パワーコア占領後、**全員のHQを元の位置に戻し**、建物を確保する。"]], "mapTitle": "部隊マップ — 初期配置", "squadName": "{x}部隊", "core": "パワーコア", "canyonCap": "キャニオンキャプテン", "legend": ["浄水施設", "軍事基地", "病院／野戦病院", "パワーコア（中央）", "部隊長", "キャニオンキャプテン"], "tipsTitle": "勝利のためのヒント", "tips": [["治療は100人単位で", "治療加速アイテムは使わない。試合終了時に全部隊が回復する。"], ["HQ攻撃は燃料ゼロ", "HQへの攻撃は燃料を消費しない。"], ["HQを叩けば敵は止まる", "HQを攻撃すると、敵は部隊を出撃できなくなる。"], ["HPの減った部隊は交代", "建物内の部隊のHPが減ったら、必ず交代させる。"], ["テレポートのタイミング", "テレポートは無料でクールダウン3分。目標を取りに行く時に合わせて使う。"]], "lineupTitle": "部隊編成", "squad": "部隊", "captain": "隊長", "schedT": "開催時間", "team": "チーム{n}", "yourT": "あなたの時間", "vote": "上記2つの時間のうち、どちらかに投票してください。別の時間を選ぶと参加資格を失う可能性があります。"}, "en": {"card": "Canyon Clash", "title": "Canyon Clash Strategy", "sub": "Last Z · 4 squads · 5 phases · 1 plan", "phase": "Phase", "phases": [["Take your positions", "Teleport to your positions. **Capture Field Hospitals and Water Refineries.**"], ["Canyon Captain spawns", "**A & B #3 and #4** teleport to the Captain and attack. Everyone else keeps securing buildings and attacking enemy HQs."], ["Military Base opens", "**C & D Captains and #2s** teleport to the Military Bases by their territory, then capture and secure them."], ["Power Core (about 20 min left)", "At **21 min remaining**, Captains + #2 & #3 from all squads teleport to the centre. **Captains + #2s:** attack only tanks around the Power Core and escort the Core to spawn. **#3s:** attack enemy HQs around the Power Core only. **#4s & #5s:** stay in position and keep securing buildings."], ["Reset and hold", "After the Power Core is captured, **all HQs return to their original positions** and secure buildings."]], "mapTitle": "Squad map — who starts where", "squadName": "{x} squad", "core": "Power Core", "canyonCap": "Canyon Captain", "legend": ["Water Refineries", "Military Bases", "Hospitals / Field Hospitals", "Power Core (centre)", "Squad Captain", "Canyon Captain"], "tipsTitle": "Tips that win the match", "tips": [["Heal in batches of 100", "Do not use healing speed-ups. All troops will be healed at the end of the match."], ["Hitting HQs costs no fuel", "Attacking an HQ does not use fuel."], ["An HQ hit shuts them down", "Hitting an HQ will make the enemy unable to deploy troops."], ["Rotate low-health troops", "Be sure to rotate out your troops in buildings if they are low on health."], ["Time your teleports", "Teleports are free with a 3-minute cooldown. Time them for when you will move to capture an objective."]], "lineupTitle": "Squad lineup", "squad": "Squad", "captain": "Captain", "schedT": "Schedule", "team": "Team {n}", "yourT": "Your time", "vote": "Vote for one of these two times. If you choose a different time, you may lose your eligibility to take part."}, "ko": {"card": "협곡전 (캐니언 클래시)", "title": "캐니언 클래시 작전", "sub": "Last Z · 4개 부대 · 5단계 · 하나의 작전", "phase": "단계", "phases": [["위치 잡기", "각자 위치로 텔레포트합니다. **야전병원과 정수 시설을 점령**합니다."], ["캐니언 캡틴 등장", "**A·B 부대의 3번과 4번**은 캡틴에게 텔레포트해 공격합니다. 나머지는 모두 건물 확보와 적 HQ 공격을 계속합니다."], ["군사 기지 개방", "**C·D 부대의 부대장과 2번**은 자기 진영 근처의 군사 기지로 텔레포트해 점령하고 확보합니다."], ["파워 코어 (약 20분 남음)", "**21분 남았을 때** 모든 부대의 부대장·2번·3번이 중앙으로 텔레포트합니다. **부대장과 2번:** 파워 코어 주변의 전차만 공격하고, 코어를 출현 지점까지 호위합니다. **3번:** 파워 코어 주변의 적 HQ만 공격합니다. **4번과 5번:** 제자리에 남아 건물 확보를 계속합니다."], ["리셋 후 방어", "파워 코어 점령 후 **모든 HQ를 원래 위치로 되돌리고** 건물을 확보합니다."]], "mapTitle": "부대 배치도 — 초기 위치", "squadName": "{x} 부대", "core": "파워 코어", "canyonCap": "캐니언 캡틴", "legend": ["정수 시설", "군사 기지", "병원 / 야전병원", "파워 코어 (중앙)", "부대장", "캐니언 캡틴"], "tipsTitle": "승리를 위한 팁", "tips": [["치료는 100명 단위로", "치료 가속 아이템은 쓰지 마세요. 경기가 끝나면 모든 부대가 회복됩니다."], ["HQ 공격은 연료 0", "HQ 공격에는 연료가 들지 않습니다."], ["HQ를 치면 적이 멈춘다", "HQ를 공격하면 적은 부대를 출격시킬 수 없게 됩니다."], ["HP가 줄어든 부대는 교대", "건물 안 부대의 HP가 줄면 반드시 교대시키세요."], ["텔레포트 타이밍", "텔레포트는 무료이고 쿨다운은 3분입니다. 목표를 점령하러 갈 때에 맞춰 사용하세요."]], "lineupTitle": "부대 편성", "squad": "부대", "captain": "부대장", "schedT": "진행 시간", "team": "팀 {n}", "yourT": "당신의 시간", "vote": "위 두 시간 중 하나에 투표하세요. 다른 시간을 고르면 참가 자격을 잃을 수 있습니다."}, "zh": {"card": "峡谷战（Canyon Clash）", "title": "峡谷冲突 作战", "sub": "Last Z · 4支部队 · 5个阶段 · 1个作战", "phase": "阶段", "phases": [["就位", "各自传送到自己的位置。**占领野战医院和净水设施。**"], ["峡谷队长出现", "**A、B部队的3号和4号**传送到峡谷队长处发起攻击。其他所有人继续占领建筑并攻击敌方HQ。"], ["军事基地开放", "**C、D部队的队长和2号**传送到己方附近的军事基地，占领并守住。"], ["能量核心（约剩20分钟）", "**剩余21分钟时**，所有部队的队长、2号、3号传送到中央。**队长和2号：**只攻击能量核心周围的战车，并护送核心到出现地点。**3号：**只攻击能量核心周围的敌方HQ。**4号和5号：**留在原地，继续守住建筑。"], ["复位并防守", "占领能量核心后，**所有人的HQ回到原来的位置**，并守住建筑。"]], "mapTitle": "部队地图 — 初始站位", "squadName": "{x}部队", "core": "能量核心", "canyonCap": "峡谷队长", "legend": ["净水设施", "军事基地", "医院／野战医院", "能量核心（中央）", "部队队长", "峡谷队长"], "tipsTitle": "获胜技巧", "tips": [["治疗以100人为单位", "不要使用治疗加速道具。比赛结束时所有部队都会恢复。"], ["攻击HQ不耗燃料", "攻击HQ不会消耗燃料。"], ["打HQ让敌人停摆", "攻击HQ后，敌人将无法派出部队。"], ["血量低的部队要轮换", "建筑内部队血量降低时，一定要换下来。"], ["把握传送时机", "传送免费，冷却3分钟。在要去占领目标时再使用。"]], "lineupTitle": "部队编成", "squad": "部队", "captain": "队长", "schedT": "举行时间", "team": "队伍{n}", "yourT": "你的时间", "vote": "请在以上两个时间中选择一个投票。选择其他时间可能会失去参加资格。"}, "es": {"card": "Canyon Clash", "title": "Estrategia Canyon Clash", "sub": "Last Z · 4 escuadrones · 5 fases · 1 plan", "phase": "Fase", "phases": [["Tomen posiciones", "Teletranspórtense a sus posiciones. **Capturen los hospitales de campaña y las refinerías de agua.**"], ["Aparece el Capitán del Cañón", "**Los n.º 3 y 4 de A y B** se teletransportan al Capitán y atacan. Todos los demás siguen asegurando edificios y atacando los HQ enemigos."], ["Se abre la base militar", "**Los capitanes y los n.º 2 de C y D** se teletransportan a las bases militares junto a su territorio, las capturan y las aseguran."], ["Núcleo de energía (quedan unos 20 min)", "**Con 21 min restantes**, los capitanes y los n.º 2 y 3 de todos los escuadrones se teletransportan al centro. **Capitanes y n.º 2:** ataquen solo a los tanques alrededor del Núcleo y escolten el Núcleo hasta su punto de aparición. **N.º 3:** ataquen solo los HQ enemigos alrededor del Núcleo. **N.º 4 y 5:** quédense en su posición y sigan asegurando edificios."], ["Reiniciar y mantener", "Tras capturar el Núcleo, **todos los HQ vuelven a su posición original** y aseguran los edificios."]], "mapTitle": "Mapa de escuadrones: posiciones iniciales", "squadName": "Escuadrón {x}", "core": "Núcleo de energía", "canyonCap": "Capitán del Cañón", "legend": ["Refinerías de agua", "Bases militares", "Hospitales / de campaña", "Núcleo de energía (centro)", "Capitán de escuadrón", "Capitán del Cañón"], "tipsTitle": "Consejos para ganar", "tips": [["Curar en lotes de 100", "No uses aceleradores de curación. Todas las tropas se curan al final de la partida."], ["Atacar HQ no gasta combustible", "Atacar un HQ no consume combustible."], ["Un HQ golpeado queda bloqueado", "Al atacar un HQ, el enemigo no puede desplegar tropas."], ["Rota las tropas con poca vida", "Cambia siempre las tropas de los edificios cuando tengan poca vida."], ["Calcula tus teletransportes", "Los teletransportes son gratis con 3 minutos de enfriamiento. Úsalos cuando vayas a capturar un objetivo."]], "lineupTitle": "Formación de escuadrones", "squad": "Escuadrón", "captain": "Capitán", "schedT": "Horario", "team": "Equipo {n}", "yourT": "Tu hora", "vote": "Vota por una de estas dos horas. Si eliges otra hora, podrías perder el derecho a participar."}, "it": {"card": "Canyon Clash", "title": "Strategia Canyon Clash", "sub": "Last Z · 4 squadre · 5 fasi · 1 piano", "phase": "Fase", "phases": [["Prendete posizione", "Teletrasportatevi nelle vostre posizioni. **Conquistate gli ospedali da campo e le raffinerie d'acqua.**"], ["Compare il Capitano del Canyon", "**I n. 3 e 4 di A e B** si teletrasportano dal Capitano e attaccano. Tutti gli altri continuano a tenere gli edifici e ad attaccare gli HQ nemici."], ["Si apre la base militare", "**I capitani e i n. 2 di C e D** si teletrasportano alle basi militari vicino al loro territorio, le conquistano e le tengono."], ["Nucleo energetico (circa 20 min alla fine)", "**A 21 minuti dalla fine**, capitani e n. 2 e 3 di tutte le squadre si teletrasportano al centro. **Capitani e n. 2:** attaccate solo i carri armati intorno al Nucleo e scortate il Nucleo fino al punto di comparsa. **N. 3:** attaccate solo gli HQ nemici intorno al Nucleo. **N. 4 e 5:** restate in posizione e continuate a tenere gli edifici."], ["Riposizionarsi e difendere", "Dopo la conquista del Nucleo, **tutti gli HQ tornano alla posizione iniziale** e tengono gli edifici."]], "mapTitle": "Mappa delle squadre: posizioni iniziali", "squadName": "Squadra {x}", "core": "Nucleo energetico", "canyonCap": "Capitano del Canyon", "legend": ["Raffinerie d'acqua", "Basi militari", "Ospedali / da campo", "Nucleo energetico (centro)", "Capitano di squadra", "Capitano del Canyon"], "tipsTitle": "Consigli per vincere", "tips": [["Cura a blocchi di 100", "Non usare acceleratori di cura. Tutte le truppe vengono curate a fine partita."], ["Attaccare gli HQ non costa carburante", "Attaccare un HQ non consuma carburante."], ["Un HQ colpito si blocca", "Attaccando un HQ, il nemico non può schierare truppe."], ["Sostituisci le truppe ferite", "Sostituisci sempre le truppe negli edifici quando hanno poca salute."], ["Scegli il momento del teletrasporto", "I teletrasporti sono gratuiti con 3 minuti di ricarica. Usali quando vai a conquistare un obiettivo."]], "lineupTitle": "Formazione delle squadre", "squad": "Squadra", "captain": "Capitano", "schedT": "Orari", "team": "Squadra {n}", "yourT": "Tua ora", "vote": "Vota uno di questi due orari. Se scegli un orario diverso, potresti perdere il diritto di partecipare."}, "fr": {"card": "Canyon Clash", "title": "Stratégie Canyon Clash", "sub": "Last Z · 4 escouades · 5 phases · 1 plan", "phase": "Phase", "phases": [["Prenez position", "Téléportez-vous à vos positions. **Capturez les hôpitaux de campagne et les raffineries d'eau.**"], ["Le Capitaine du Canyon apparaît", "**Les n° 3 et 4 de A et B** se téléportent sur le Capitaine et l'attaquent. Tous les autres continuent de tenir les bâtiments et d'attaquer les HQ ennemis."], ["La base militaire s'ouvre", "**Les chefs et les n° 2 de C et D** se téléportent vers les bases militaires proches de leur territoire, les capturent et les tiennent."], ["Noyau d'énergie (environ 20 min restantes)", "**À 21 min de la fin**, les chefs et les n° 2 et 3 de toutes les escouades se téléportent au centre. **Chefs et n° 2 :** attaquez uniquement les tanks autour du Noyau et escortez le Noyau jusqu'à son point d'apparition. **N° 3 :** attaquez uniquement les HQ ennemis autour du Noyau. **N° 4 et 5 :** restez en position et continuez de tenir les bâtiments."], ["Se replacer et tenir", "Une fois le Noyau capturé, **tous les HQ reviennent à leur position d'origine** et tiennent les bâtiments."]], "mapTitle": "Carte des escouades : positions de départ", "squadName": "Escouade {x}", "core": "Noyau d'énergie", "canyonCap": "Capitaine du Canyon", "legend": ["Raffineries d'eau", "Bases militaires", "Hôpitaux / de campagne", "Noyau d'énergie (centre)", "Chef d'escouade", "Capitaine du Canyon"], "tipsTitle": "Conseils pour gagner", "tips": [["Soignez par lots de 100", "N'utilisez pas d'accélérateurs de soin. Toutes les troupes sont soignées à la fin du match."], ["Attaquer un HQ ne coûte pas de carburant", "Attaquer un HQ ne consomme pas de carburant."], ["Un HQ touché est paralysé", "Attaquer un HQ empêche l'ennemi de déployer des troupes."], ["Faites tourner les troupes affaiblies", "Remplacez toujours les troupes des bâtiments quand leurs PV baissent."], ["Choisissez le moment de vos téléportations", "Les téléportations sont gratuites avec 3 minutes de recharge. Utilisez-les au moment d'aller capturer un objectif."]], "lineupTitle": "Composition des escouades", "squad": "Escouade", "captain": "Chef", "schedT": "Horaires", "team": "Équipe {n}", "yourT": "Votre heure", "vote": "Votez pour l'un de ces deux horaires. Si vous choisissez un autre horaire, vous risquez de perdre le droit de participer."}, "vi": {"card": "Canyon Clash", "title": "Chiến thuật Canyon Clash", "sub": "Last Z · 4 đội · 5 giai đoạn · 1 kế hoạch", "phase": "Giai đoạn", "phases": [["Vào vị trí", "Dịch chuyển đến vị trí của mình. **Chiếm bệnh viện dã chiến và nhà máy lọc nước.**"], ["Đội trưởng Hẻm núi xuất hiện", "**Số 3 và 4 của đội A, B** dịch chuyển đến Đội trưởng Hẻm núi và tấn công. Tất cả những người còn lại tiếp tục giữ công trình và tấn công HQ địch."], ["Căn cứ quân sự mở", "**Đội trưởng và số 2 của đội C, D** dịch chuyển đến căn cứ quân sự gần lãnh thổ mình, chiếm và giữ lấy."], ["Lõi năng lượng (còn khoảng 20 phút)", "**Khi còn 21 phút**, đội trưởng, số 2 và số 3 của tất cả các đội dịch chuyển vào trung tâm. **Đội trưởng và số 2:** chỉ tấn công xe tăng quanh Lõi năng lượng và hộ tống Lõi đến điểm xuất hiện. **Số 3:** chỉ tấn công HQ địch quanh Lõi năng lượng. **Số 4 và 5:** ở lại vị trí và tiếp tục giữ công trình."], ["Về vị trí và giữ", "Sau khi chiếm Lõi năng lượng, **tất cả HQ quay về vị trí ban đầu** và giữ công trình."]], "mapTitle": "Bản đồ đội — vị trí ban đầu", "squadName": "Đội {x}", "core": "Lõi năng lượng", "canyonCap": "Đội trưởng Hẻm núi", "legend": ["Nhà máy lọc nước", "Căn cứ quân sự", "Bệnh viện / dã chiến", "Lõi năng lượng (trung tâm)", "Đội trưởng", "Đội trưởng Hẻm núi"], "tipsTitle": "Mẹo để chiến thắng", "tips": [["Hồi máu theo lô 100", "Không dùng tăng tốc hồi máu. Tất cả quân sẽ được hồi khi trận đấu kết thúc."], ["Đánh HQ không tốn nhiên liệu", "Tấn công HQ không tiêu hao nhiên liệu."], ["Đánh HQ khiến địch tê liệt", "Khi HQ bị tấn công, địch không thể xuất quân."], ["Thay quân yếu máu", "Nhớ thay quân trong công trình khi máu của họ xuống thấp."], ["Canh thời điểm dịch chuyển", "Dịch chuyển miễn phí, hồi chiêu 3 phút. Hãy dùng khi đi chiếm mục tiêu."]], "lineupTitle": "Đội hình", "squad": "Đội", "captain": "Đội trưởng", "schedT": "Thời gian", "team": "Đội {n}", "yourT": "Giờ của bạn", "vote": "Hãy bình chọn một trong hai khung giờ trên. Nếu chọn giờ khác, bạn có thể mất quyền tham gia."}, "th": {"card": "Canyon Clash", "title": "แผนการรบ Canyon Clash", "sub": "Last Z · 4 หน่วย · 5 เฟส · 1 แผน", "phase": "เฟส", "phases": [["เข้าประจำตำแหน่ง", "เทเลพอร์ตไปยังตำแหน่งของตัวเอง **ยึดโรงพยาบาลสนามและโรงกรองน้ำ**"], ["กัปตันแคนยอนปรากฏ", "**หมายเลข 3 และ 4 ของหน่วย A และ B** เทเลพอร์ตไปโจมตีกัปตัน คนอื่นทั้งหมดยึดอาคารต่อและโจมตี HQ ศัตรูต่อไป"], ["ฐานทัพทหารเปิด", "**หัวหน้าหน่วยและหมายเลข 2 ของหน่วย C และ D** เทเลพอร์ตไปยังฐานทัพทหารใกล้ฝั่งตัวเอง ยึดและรักษาไว้"], ["พาวเวอร์คอร์ (เหลือประมาณ 20 นาที)", "**เมื่อเหลือ 21 นาที** หัวหน้าหน่วย หมายเลข 2 และ 3 ของทุกหน่วยเทเลพอร์ตไปตรงกลาง **หัวหน้าหน่วยและหมายเลข 2:** โจมตีเฉพาะรถถังรอบพาวเวอร์คอร์ และคุ้มกันคอร์ไปจนถึงจุดเกิด **หมายเลข 3:** โจมตีเฉพาะ HQ ศัตรูรอบพาวเวอร์คอร์ **หมายเลข 4 และ 5:** อยู่ที่เดิมและยึดอาคารต่อไป"], ["กลับที่เดิมแล้วตั้งรับ", "หลังยึดพาวเวอร์คอร์ได้ **ทุกคนย้าย HQ กลับตำแหน่งเดิม** และยึดอาคารไว้"]], "mapTitle": "แผนที่หน่วย — ตำแหน่งเริ่มต้น", "squadName": "หน่วย {x}", "core": "พาวเวอร์คอร์", "canyonCap": "กัปตันแคนยอน", "legend": ["โรงกรองน้ำ", "ฐานทัพทหาร", "โรงพยาบาล / สนาม", "พาวเวอร์คอร์ (ตรงกลาง)", "หัวหน้าหน่วย", "กัปตันแคนยอน"], "tipsTitle": "เคล็ดลับสู่ชัยชนะ", "tips": [["รักษาทีละ 100 นาย", "อย่าใช้ไอเทมเร่งการรักษา ทุกหน่วยจะฟื้นตัวเมื่อจบการแข่งขัน"], ["ตี HQ ไม่ใช้น้ำมัน", "การโจมตี HQ ไม่เสียน้ำมัน"], ["ตี HQ แล้วศัตรูหยุด", "เมื่อ HQ ถูกโจมตี ศัตรูจะส่งกองทัพออกไม่ได้"], ["สลับหน่วยที่ HP ลด", "เมื่อ HP ของหน่วยในอาคารลดลง ให้สลับเปลี่ยนทุกครั้ง"], ["จังหวะเทเลพอร์ต", "เทเลพอร์ตฟรี คูลดาวน์ 3 นาที ใช้ให้ตรงกับตอนที่จะไปยึดเป้าหมาย"]], "lineupTitle": "การจัดหน่วย", "squad": "หน่วย", "captain": "หัวหน้า", "schedT": "เวลาจัด", "team": "ทีม {n}", "yourT": "เวลาของคุณ", "vote": "โหวตเลือกหนึ่งในสองเวลานี้ ถ้าเลือกเวลาอื่น อาจเสียสิทธิ์เข้าร่วม"}, "id": {"card": "Canyon Clash", "title": "Strategi Canyon Clash", "sub": "Last Z · 4 pasukan · 5 fase · 1 rencana", "phase": "Fase", "phases": [["Ambil posisi", "Teleport ke posisi masing-masing. **Rebut rumah sakit lapangan dan kilang air.**"], ["Kapten Canyon muncul", "**No. 3 dan 4 dari pasukan A & B** teleport ke Kapten dan menyerang. Yang lain tetap menjaga bangunan dan menyerang HQ musuh."], ["Markas militer terbuka", "**Kapten dan No. 2 pasukan C & D** teleport ke markas militer dekat wilayahnya, lalu merebut dan menjaganya."], ["Power Core (sisa sekitar 20 menit)", "**Saat sisa 21 menit**, kapten serta No. 2 dan 3 dari semua pasukan teleport ke tengah. **Kapten dan No. 2:** hanya serang tank di sekitar Power Core dan kawal Core sampai titik munculnya. **No. 3:** hanya serang HQ musuh di sekitar Power Core. **No. 4 dan 5:** tetap di posisi dan terus menjaga bangunan."], ["Kembali dan bertahan", "Setelah Power Core direbut, **semua HQ kembali ke posisi awal** dan menjaga bangunan."]], "mapTitle": "Peta pasukan — posisi awal", "squadName": "Pasukan {x}", "core": "Power Core", "canyonCap": "Kapten Canyon", "legend": ["Kilang air", "Markas militer", "Rumah sakit / lapangan", "Power Core (tengah)", "Kapten pasukan", "Kapten Canyon"], "tipsTitle": "Tips untuk menang", "tips": [["Sembuhkan per 100", "Jangan pakai percepatan penyembuhan. Semua pasukan pulih saat pertandingan berakhir."], ["Serang HQ tanpa bahan bakar", "Menyerang HQ tidak menghabiskan bahan bakar."], ["HQ diserang, musuh berhenti", "Jika HQ diserang, musuh tidak bisa mengirim pasukan."], ["Ganti pasukan yang HP-nya rendah", "Selalu ganti pasukan di dalam bangunan jika HP-nya menurun."], ["Atur waktu teleport", "Teleport gratis dengan cooldown 3 menit. Gunakan saat akan merebut target."]], "lineupTitle": "Susunan pasukan", "squad": "Pasukan", "captain": "Kapten", "schedT": "Jadwal", "team": "Tim {n}", "yourT": "Waktu Anda", "vote": "Pilih salah satu dari dua waktu ini. Jika memilih waktu lain, Anda bisa kehilangan hak ikut serta."}, "tl": {"card": "Canyon Clash", "title": "Canyon Clash na Estratehiya", "sub": "Last Z · 4 squad · 5 phase · 1 plano", "phase": "Phase", "phases": [["Pumuwesto", "Mag-teleport sa inyong puwesto. **Kunin ang mga Field Hospital at Water Refinery.**"], ["Lumitaw ang Canyon Captain", "**Ang #3 at #4 ng A at B** ay magte-teleport sa Captain at aatake. Ang lahat ng iba ay patuloy na magbabantay ng mga gusali at aatake sa mga HQ ng kalaban."], ["Bukas na ang Military Base", "**Ang mga Captain at #2 ng C at D** ay magte-teleport sa mga Military Base malapit sa kanilang teritoryo, kukunin at babantayan ito."], ["Power Core (mga 20 minuto na lang)", "**Kapag 21 minuto na lang**, ang mga Captain at #2 at #3 ng lahat ng squad ay magte-teleport sa gitna. **Mga Captain at #2:** tanks lang sa paligid ng Power Core ang atakihin, at i-escort ang Core hanggang sa spawn point nito. **Mga #3:** mga HQ lang ng kalaban sa paligid ng Power Core ang atakihin. **Mga #4 at #5:** manatili sa puwesto at patuloy na bantayan ang mga gusali."], ["Bumalik at magbantay", "Pagkakuha ng Power Core, **ibalik ng lahat ang HQ sa orihinal na puwesto** at bantayan ang mga gusali."]], "mapTitle": "Mapa ng squad — panimulang puwesto", "squadName": "Squad {x}", "core": "Power Core", "canyonCap": "Canyon Captain", "legend": ["Water Refinery", "Military Base", "Ospital / Field Hospital", "Power Core (gitna)", "Squad Captain", "Canyon Captain"], "tipsTitle": "Mga tip para manalo", "tips": [["Mag-heal nang tig-100", "Huwag gumamit ng healing speed-up. Gagaling ang lahat ng tropa pagkatapos ng laban."], ["Walang fuel ang pag-atake sa HQ", "Hindi gumagamit ng fuel ang pag-atake sa HQ."], ["Kapag tinamaan ang HQ, tigil ang kalaban", "Kapag inatake ang HQ, hindi makakapag-deploy ng tropa ang kalab  tema cambia cada 4 horas (6 veces al día). Con 18 medallas de armamento consigues un fragmento naranja. Las medallas no pasan al día siguiente.", "r2t": "Misiones de radar", "r2p": "+8 misiones cada 8 horas (se renuevan a las {11} / {19} / {03}). Las misiones sin terminar pueden desaparecer al renovarse, así que lo básico es **completarlas y dejarlas como cofres**. Lo que supere el límite se pierde.", "r3t": "Cómo jugarlo", "r3p": "Los turnos de las **{19} y {07}** suelen coincidir con el tema del Duelo de Alianzas. Guarda los gastos grandes, como aceleradores y objetos, para esos dos turnos.", "detail": "Detalle por día", "week": "Horario semanal (resumen)", "tipsT": "Consejos para sumar puntos", "tips": ["Más que trabajar más, lo básico es **concentrar el gasto en el día y la hora que tocan**.", "No recojas enseguida las construcciones o investigaciones terminadas; **espera al turno que corresponde**.", "Ascender soldados solo puntúa la diferencia. Cuando tus tropas estén cerca del límite, asciéndelas todas juntas en el **turno de ejército del viernes**.", "El sábado (derrotar enemigos), **no ataques bases ni tropas recolectoras con NAP**."], "note": "El contenido puede cambiar con las actualizaciones del juego. Comprueba también lo que muestra el juego.", "cats": {"build": "Construcción", "research": "Investigación", "hero": "Héroe", "army": "Ejército", "car": "Vehículo"}, "match": "Ideal", "today": "HOY", "nextL": "+1 = día siguiente", "matchL": "Ideal = coincide con el Duelo de Alianzas", "tasksT": "Tareas que dan puntos", "todoT": "Qué hacer", "themeL": "Tema del Duelo de Alianzas", "thDay": "Día", "thTheme": "Duelo", "tzL": "Zona horaria", "tzAuto": "Automática (este dispositivo)", "tzNote": "Las horas se muestran en {tz}. El juego usa AT (Hora del Apocalipsis, 11 horas menos que Japón). El día de juego empieza a las 00:00 AT, es decir, a las {t} en tu hora.", "wd": ["LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB", "DOM"], "themes": ["Mejora de vehículos", "Constru const SVS = {"ja": {"tab": "SvS", "title": "SvS（サーバー VS サーバー）", "ovT": "概要", "ov": ["2週間ごとに開催されます。", "日〜金曜の侵略権争奪を経て、土曜日の戦闘フェーズで首都防衛側と侵略側に分かれて行います。"], "pA": "侵略権争奪", "pB": "戦闘フェーズ", "tT": "侵略権争奪タスク", "tL": "以下のタスクで侵略権を奪い合います。", "must": "全員必須", "tasks": ["同盟対決勝利", "同盟対決毎日第1位", "全面戦備第1位", "競技場第1位", "トラックを発車", "敵戦区トラックの略奪の成功", "凶暴首領ゾンビの戦区総ダメージで勝利", "凶暴首領 個人ダメージ第1位"], "mT": "全員が必ず達成するタスク", "mi": [["トラックを発車", "毎日4回トラックを発車。敵に略奪されないようにF1×4回が望ましい。"], ["敵戦区トラックの略奪の成功", "トラックは対戦相手のサーバーから略奪しましょう。"], ["凶暴首領ゾンビの戦区総ダメージで勝利", "戦争狂熱バフや首都バフを用いて最大火力を出す。"]], "dT": "防衛側", "d": "自サーバーの首都周囲の泥地に高HQプレイヤーを配置します。草地にはシールドを張って増援を送るプレイヤーを配置します。敵が入り込めないように、隙間を開けずに配置します。", "oT": "侵略側", "o": "敵サーバーの首都と周辺の敵HQを破壊して場所を確保します。草地にはシールドを張ったプレイヤーを配置して増援を送ります。", "cap": "参考：首都（大統領府）周辺の配置例"}, "en": {"tab": "SvS", "title": "SvS (Server vs Server)", "ovT": "Overview", "ov": ["Held every 2 weeks.", "From Sunday to Friday, servers compete for invasion rights. In Saturday's battle phase, players split into capital defenders and invaders."], "pA": "Invasion rights", "pB": "Battle phase", "tT": "Invasion-rights tasks", "tL": "These tasks decide who wins invasion rights.", "must": "Everyone", "tasks": ["Win the Alliance Duel", "Daily #1 in the Alliance Duel", "#1 in Arms Race", "#1 in the Arena", "Dispatch trucks", "Successfully raid trucks in the enemy zone", "Win on total zone damage to the Ferocious Boss Zombie", "#1 personal damage to the Ferocious Boss"], "mT": "Tasks everyone must complete", "mi": [["Dispatch trucks", "Dispatch trucks 4 times every day. F1 × 4 is best so the enemy can't raid them."], ["Raid trucks in the enemy zone", "Raid trucks from the server you are fighting."], ["Win on total zone damage to the Ferocious Boss Zombie", "Use the War Frenzy buff and the capital buff to deal maximum damage."]], "dT": "Defenders", "d": "Place high-HQ players on the mud around our server's capital. On the grass, place players with shields up who send reinforcements. Leave no gaps so the enemy can't get in.", "oT": "Invaders", "o": "Destroy the enemy server's capital and the enemy HQs around it to take the space. On the grass, place players with shields up who send reinforcements.", "cap": "Reference: example of positions around the capital (Presidential Palace)"}, "ko": {"tab": "SvS", "title": "SvS (서버 대 서버)", "ovT": "개요", "ov": ["2주마다 열립니다.", "일~금요일에 침략권 쟁탈을 거쳐, 토요일 전투 단계에서 수도 방어 측과 침략 측으로 나뉘어 싸웁니다."], "pA": "침략권 쟁탈", "pB": "전투 단계", "tT": "침략권 쟁탈 태스크", "tL": "아래 태스크로 침략권을 다툽니다.", "must": "전원 필수", "tasks": ["동맹 대결 승리", "동맹 대결 매일 1위", "전면 전비 1위", "경기장 1위", "트럭 출발", "적 구역 트럭 약탈 성공", "흉포한 보스 좀비 구역 총 피해량 승리", "흉포한 보스 개인 피해량 1위"], "mT": "전원이 반드시 달성할 태스크", "mi": [["트럭 출발", "매일 트럭을 4번 출발시키세요. 적에게 약탈당하지 않도록 F1×4회가 좋습니다."], ["적 구역 트럭 약탈 성공", "트럭은 대전 상대 서버에서 약탈하세요."], ["흉포한 보스 좀비 구역 총 피해량 승리", "전쟁 열광 버프와 수도 버프를 사용해 최대 화력을 내세요."]], "dT": "방어 측", "d": "우리 서버 수도 주변의 진흙 지대에는 HQ가 높은 플레이어를 배치합니다. 잔디 지대에는 실드를 켜고 증원을 보내는 플레이어를 배치합니다. 적이 들어오지 못하도록 빈틈 없이 배치합니다.", "oT": "침략 측", "o": "적 서버의 수도와 주변 적 HQ를 파괴해 자리를 확보합니다. 잔디 지대에는 실드를 켠 플레이어를 배치해 증원을 보냅니다.", "cap": "참고: 수도(대통령부) 주변 배치 예시"}, "zh": {"tab": "SvS", "title": "SvS（服务器对战）", "ovT": "概要", "ov": ["每2周举行一次。", "周日至周五争夺侵略权，周六的战斗阶段分为首都防守方和侵略方进行对战。"], "pA": "争夺侵略权", "pB": "战斗阶段", "tT": "侵略权争夺任务", "tL": "通过以下任务争夺侵略权。", "must": "全员必做", "tasks": ["同盟对决胜利", "同盟对决每日第1名", "全面备战第1名", "竞技场第1名", "卡车发车", "成功掠夺敌方战区的卡车", "凶暴首领僵尸战区总伤害获胜", "凶暴首领个人伤害第1名"], "mT": "全员必须完成的任务", "mi": [["卡车发车", "每天发车4次。为了不被敌人掠夺，最好F1×4次。"], ["成功掠夺敌方战区的卡车", "请从对战服务器掠夺卡车。"], ["凶暴首领僵尸战区总伤害获胜", "使用战争狂热增益和首都增益，打出最大火力。"]], "dT": "防守方", "d": "在本服首都周围的泥地安排高HQ玩家。草地安排开护盾并派遣增援的玩家。不留空隙，不让敌人进入。", "oT": "侵略方", "o": "摧毁敌方服务器的首都及周边敌方HQ，占据位置。草地安排开护盾的玩家派遣增援。", "cap": "参考：首都（总统府）周边的站位示例"}, "es": {"tab": "SvS", "title": "SvS (Servidor contra Servidor)", "ovT": "Resumen", "ov": ["Se celebra cada 2 semanas.", "De domingo a viernes se disputan los derechos de invasión; en la fase de combate del sábado, cada lado se divide en defensores de la capital e invasores."], "pA": "Derechos de invasión", "pB": "Fase de combate", "tT": "Tareas por los derechos de invasión", "tL": "Estas tareas deciden quién gana los derechos de invasión.", "must": "Todos", "tasks": ["Ganar el Duelo de Alianzas", "1.º diario en el Duelo de Alianzas", "1.º en la Carrera Armamentista", "1.º en la Arena", "Enviar camiones", "Saquear con éxito camiones de la zona enemiga", "Ganar por daño total de zona al Jefe Zombi Feroz", "1.º en daño personal al Jefe Feroz"], "mT": "Tareas que todos deben completar", "mi": [["Enviar camiones", "Envía camiones 4 veces al día. Lo ideal es F1 × 4 para que el enemigo no los saquee."], ["Saquear camiones de la zona enemiga", "Saquea camiones del servidor rival."], ["Ganar por daño total de zona al Jefe Zombi Feroz", "Usa el bonus de Frenesí de Guerra y el bonus de capital para hacer el máximo daño."]], "dT": "Defensores", "d": "Coloca a los jugadores de HQ alto en el barro alrededor de la capital de nuestro servidor. En el césped, coloca a jugadores con escudo que envíen refuerzos. No dejes huecos para que el enemigo no entre.", "oT": "Invasores", "o": "Destruye la capital del servidor enemigo y los HQ enemigos de alrededor para ocupar el espacio. En el césped, coloca a jugadores con escudo que envíen refuerzos.", "cap": "Referencia: ejemplo de posiciones alrededor de la capital (Palacio Presidencial)"}, "it": {"tab": "SvS", "title": "SvS (Server contro Server)", "ovT": "Panoramica", "ov": ["Si tiene ogni 2 settimane.", "Da domenica a venerdì si contendono i diritti d'invasione; nella fase di battaglia del sabato ci si divide tra difensori della capitale e invasori."], "pA": "Diritti d'invasione", "pB": "Fase di battaglia", "tT": "Compiti per i diritti d'invasione", "tL": "Questi compiti decidono chi ottiene i diritti d'invasione.", "must": "Tutti", "tasks": ["Vincere il Duello d'Alleanza", "1° giornaliero nel Duello d'Alleanza", "1° nella Corsa agli Armamenti", "1° nell'Arena", "Inviare camion", "Razziare con successo camion della zona nemica", "Vincere per danno tot
